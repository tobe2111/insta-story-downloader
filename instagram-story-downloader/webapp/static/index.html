<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram 스토리 다운로더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        @media (max-width: 640px) {
            .story-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
        .story-item {
            position: relative;
            aspect-ratio: 9 / 16;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .story-item img, .story-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #e1306c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .instagram-gradient {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        .download-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .download-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }
        .video-indicator {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 헤더 -->
    <header class="instagram-gradient text-white py-6 px-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-center flex items-center justify-center gap-2">
                <i class="fab fa-instagram"></i>
                스토리 다운로더
            </h1>
            <p class="text-center text-sm mt-2 opacity-90">닉네임을 입력하여 스토리를 확인하세요</p>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        <!-- 검색창 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <div class="flex gap-3">
                <div class="flex-1 relative">
                    <input 
                        type="text" 
                        id="usernameInput" 
                        placeholder="Instagram 닉네임 입력 (예: instagram)"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-pink-500 focus:outline-none text-base"
                        onkeypress="if(event.key === 'Enter') searchStories()"
                    >
                    <i class="fas fa-user absolute right-4 top-4 text-gray-400"></i>
                </div>
                <button 
                    onclick="searchStories()"
                    class="instagram-gradient text-white px-6 py-3 rounded-xl font-semibold hover:opacity-90 transition-opacity"
                >
                    <i class="fas fa-search"></i>
                    <span class="ml-2 hidden sm:inline">검색</span>
                </button>
            </div>
        </div>

        <!-- 로딩 상태 -->
        <div id="loadingState" class="hidden text-center py-12">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-gray-600">스토리를 불러오는 중...</p>
        </div>

        <!-- 에러 메시지 -->
        <div id="errorMessage" class="hidden bg-red-50 border-2 border-red-200 rounded-2xl p-6 mb-6">
            <div class="flex items-start gap-3">
                <i class="fas fa-exclamation-circle text-red-500 text-xl mt-1"></i>
                <div class="flex-1">
                    <h3 class="font-bold text-red-800 mb-1">오류 발생</h3>
                    <p class="text-red-600" id="errorText"></p>
                </div>
            </div>
        </div>

        <!-- 프로필 정보 -->
        <div id="profileInfo" class="hidden bg-white rounded-2xl shadow-lg p-6 mb-6">
            <div class="flex items-center gap-4">
                <img id="profilePic" src="" alt="" class="w-16 h-16 rounded-full border-4 border-pink-500">
                <div class="flex-1">
                    <h2 class="text-xl font-bold" id="fullName"></h2>
                    <p class="text-gray-600">@<span id="username"></span></p>
                </div>
                <div class="text-center">
                    <p class="text-2xl font-bold text-pink-500" id="storyCount">0</p>
                    <p class="text-sm text-gray-600">스토리</p>
                </div>
            </div>
        </div>

        <!-- 스토리 그리드 -->
        <div id="storiesContainer" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">
                    <i class="fas fa-images text-pink-500 mr-2"></i>스토리
                </h3>
                <button 
                    onclick="openCoupangLink()"
                    class="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-600 transition-colors"
                >
                    <i class="fas fa-gift mr-1"></i> 쿠팡 바로가기
                </button>
            </div>
            <div id="storiesGrid" class="story-grid"></div>
        </div>

        <!-- 안내 메시지 (초기 화면) -->
        <div id="welcomeMessage" class="text-center py-12">
            <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md mx-auto">
                <i class="fas fa-info-circle text-pink-500 text-5xl mb-4"></i>
                <h3 class="text-xl font-bold mb-3">사용 방법</h3>
                <div class="text-left space-y-2 text-gray-700">
                    <p>1️⃣ 위 검색창에 Instagram 닉네임 입력</p>
                    <p>2️⃣ 검색 버튼 클릭 또는 엔터</p>
                    <p>3️⃣ 스토리 확인 및 다운로드</p>
                </div>
                <div class="mt-6 p-4 bg-yellow-50 rounded-lg border border-yellow-200">
                    <p class="text-sm text-yellow-800">
                        <i class="fas fa-exclamation-triangle mr-1"></i>
                        공개 계정의 스토리만 확인 가능합니다
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="text-center py-6 text-gray-600 text-sm">
        <p>Instagram Story Downloader © 2024</p>
        <p class="mt-2">
            <a href="https://link.coupang.com/a/dBZhpC" target="_blank" class="text-blue-500 hover:underline">
                쿠팡 파트너스 링크
            </a>
        </p>
    </footer>

    <script>
        const API_BASE_URL = window.location.origin;

        async function searchStories() {
            const username = document.getElementById('usernameInput').value.trim();
            
            if (!username) {
                showError('닉네임을 입력해주세요.');
                return;
            }

            // UI 초기화
            hideAll();
            document.getElementById('loadingState').classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/api/stories/${username}`);
                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || '스토리를 불러올 수 없습니다.');
                    return;
                }

                displayStories(data);
            } catch (error) {
                showError('서버와 통신 중 오류가 발생했습니다: ' + error.message);
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
            }
        }

        function displayStories(data) {
            // 프로필 정보 표시
            document.getElementById('profilePic').src = data.profile_pic;
            document.getElementById('fullName').textContent = data.full_name;
            document.getElementById('username').textContent = data.username;
            document.getElementById('storyCount').textContent = data.stories.length;
            document.getElementById('profileInfo').classList.remove('hidden');

            // 스토리 그리드 표시
            const grid = document.getElementById('storiesGrid');
            grid.innerHTML = '';

            data.stories.forEach((story, index) => {
                const storyItem = createStoryItem(story, index);
                grid.appendChild(storyItem);
            });

            document.getElementById('storiesContainer').classList.remove('hidden');
        }

        function createStoryItem(story, index) {
            const div = document.createElement('div');
            div.className = 'story-item';

            if (story.type === 'video') {
                // 비디오 스토리
                div.innerHTML = `
                    <video src="${story.url}" 
                           poster="${story.thumbnail || ''}"
                           controls 
                           playsinline>
                    </video>
                    <div class="video-indicator">
                        <i class="fas fa-play"></i> 동영상
                    </div>
                    <button onclick="downloadMedia('${story.url}', 'story_${index + 1}.mp4')" 
                            class="download-btn">
                        <i class="fas fa-download"></i> 다운로드
                    </button>
                `;
            } else {
                // 이미지 스토리
                div.innerHTML = `
                    <img src="${story.url}" alt="Story ${index + 1}" loading="lazy">
                    <button onclick="downloadMedia('${story.url}', 'story_${index + 1}.jpg')" 
                            class="download-btn">
                        <i class="fas fa-download"></i> 다운로드
                    </button>
                `;
            }

            return div;
        }

        async function downloadMedia(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (error) {
                alert('다운로드 중 오류가 발생했습니다: ' + error.message);
            }
        }

        function openCoupangLink() {
            window.open('https://link.coupang.com/a/dBZhpC', '_blank');
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
        }

        function hideAll() {
            document.getElementById('welcomeMessage').classList.add('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('profileInfo').classList.add('hidden');
            document.getElementById('storiesContainer').classList.add('hidden');
        }

        // 페이지 로드 시 쿠팡 링크 클릭 이벤트 추가
        window.addEventListener('load', () => {
            console.log('Instagram Story Downloader Ready');
        });
    </script>
</body>
</html>
