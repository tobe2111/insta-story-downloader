name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# 최소 권한 명시 — 미지정이면 저장소 기본값(조직 설정에 따라
# write-all일 수 있다)을 물려받는다. 워크플로가 필요한 만큼만 갖게 한다.
# 테스트만 돈다 — 저장소를 읽기만 하면 된다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # ⚠️ 왜 15분인가(2026-08-11 감사): ea3695b5의 PR 실행에서 test(3.12)가
    #    **45분을 매달린 뒤** 실패로 끝났다. 같은 커밋의 push 실행은 정상
    #    통과했으니 코드 결함이 아니라 멈춤이다(테스트 단계가 in_progress인
    #    채로 잡이 종료됐고, 이후 단계는 pending이었다).
    #    문제는 그때 **로그가 남지 않아 원인을 끝내 못 봤다는 것**이다.
    #    매달리면 GitHub가 깔끔히 끊으면서 **로그를 보존**한다 — 다음에 또
    #    나면 어느 검사에서 멈췄는지 볼 수 있다.
    #
    #    ⚠️ 2026-08-17(감사 278)에 15분 → 25분. 공개 페이지를 진짜
    #       브라우저로 띄워 보는 검사가 이날부터 **실제로 돌기 시작**했다
    #       (그전에는 브라우저가 없어 조용히 건너뛰었다). 실측이 2분에서
    #       **10분**으로 늘었다. 15분이면 여유가 5분뿐이라 러너가 조금만
    #       느린 날 관문이 헛울린다 — 헛울리는 관문은 곧 무시당하고,
    #       무시당하는 관문은 없는 관문이다.
    #
    #    ⚠️ 2026-08-25에 25분 → 35분. 같은 일이 또 났다: 3.12가 멈춘 게
    #       아니라 **꾸준히 85%까지 진행하다** 25분에서 잘렸고, 3.11은
    #       24분 56초 — 4초 차이로 통과했다. 유니버스 45종목 확장과 실시간
    #       화면 검사들로 스위트가 실제로 자랐다. 한도는 '매달림 감지'용이지
    #       '빨리 돌라'는 채찍이 아니다 — 정상 실행이 걸리는 시간에 여유
    #       10분을 더한 값으로 유지한다.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 테스트는 데이터 소스 없으면 합성 데이터로 폴백하므로 핵심 의존성만 설치
          # cryptography는 '선택' 의존성이지만 Ed25519 라이선스 경로도 CI에서
          # 검증하기 위해 설치한다(없으면 해당 테스트는 자동 skip).
          # 검사도 실전과 **같은 파일**로 설치한다(감사 130) — 두 환경이
          # 갈라지면 한쪽에만 있는 결함은 다른 쪽에서 안 보인다.
          pip install -r requirements.txt -r requirements-extra.txt

      # 공개 페이지가 **진짜로 그려지는가**를 보는 검사들은 브라우저를 띄운다.
      # 브라우저가 없으면 그 검사들은 조용히 건너뛴다 — 그리고 2026-08-17까지
      # 정확히 그 상태였다(감사 278). 첫 화면·잔고·금액·보유 대비 성적 계약이
      # CI에서 한 번도 돈 적이 없었다. 여기서 받는다.
      - name: 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements-extra.txt') }}

      - name: 크로미움 설치 (화면 렌더 검사용)
        # ⚠️ `--with-deps`를 뺐다(2026-08-18). 그 옵션은 apt로 시스템
        #    라이브러리를 깔러 가는데, 2026-08-18 CI에서 우분투 미러가
        #    **24분을 멈춰** 잡이 25분 상한에 걸려 취소됐다(테스트는 시작도
        #    못 했다). ubuntu-latest 러너에는 크로미움이 쓰는 라이브러리가
        #    이미 들어 있어 브라우저 본체만 받으면 된다. 정말 모자라면
        #    launch가 큰 소리로 죽고, 그 사실은 화면 계약 검사가 잡는다 —
        #    조용히 건너뛰는 길은 감사 278·280이 이미 막아 두었다.
        #    단계 상한도 함께 건다: 매달리면 잡 전체가 아니라 이 단계가 죽는다.
        timeout-minutes: 6
        run: python -m playwright install chromium

      - name: Syntax check (py_compile)
        run: python -m py_compile $(find quant examples tests -name "*.py")

      # 변이 목록이 코드와 맞물려 있는가 — 몇 초짜리 구조 검사(감사 125).
      # 안전장치를 지키는 변이 항목의 '원본 문자열'이 리팩터링에 밀려 안
      # 맞게 되면, 그 항목은 조용히 건너뛰어지고 그 장치는 무방비가 된다.
      # 진짜 변이 시험(항목마다 pytest 2회)은 무거워서 야간 잡
      # (mutation-sweep.yml)이 돈다 — 여기서는 목록이 살아 있는지만 본다.
      - name: 변이 목록 정합성 (mutation_check --dry-run)
        run: python3 scripts/mutation_check.py --dry-run

      - name: Run tests
        run: pytest -q

  # 의존성 감사 — 고정 범위(requirements.txt)가 실제로 설치 가능한지(pip check)와
  # 알려진 취약점(pip-audit)을 확인한다. 테스트 잡과 분리해 서로 막지 않는다.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # 같은 이유 — 매달리면 끊고 로그를 남긴다
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pip check (의존성 충돌 검사)
        run: pip check

      - name: pip-audit (취약점 스캔 — 리포트 용도)
        # `|| true`로 당분간 non-blocking: 우리가 코드를 바꾸지 않아도 새 취약점이
        # 공개되는 것만으로 CI 전체가 깨지는 것을 방지한다(리포트로 확인 후 대응).
        # 취약점 처리 절차가 자리 잡으면 `|| true`를 제거해 차단으로 전환할 것.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict || true
