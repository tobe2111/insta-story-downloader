name: Daily Paper

# 매일 자동 페이퍼 운용 — 사용자가 아무것도 안 해도 매일 돌아간다.
# 매일 20:30 UTC(= 새벽 5:30 KST, nightly-retrain 30분 뒤 — 그날 승격된 챔피언을
# 바로 사용) 챔피언 전략으로 하루치 모의 매매를 하고, 계좌 상태(state/paper/)와
# 사이트용 요약(docs/status.json)을 커밋한다. docs/ 는 push 시 Cloudflare Pages로
# 자동 배포되므로 웹사이트만 열면 매일의 결과가 보인다.
#
# ⚠️ 페이퍼(모의) 운용이다 — 실제 돈이 오가지 않으며, 실거래 자동 전환은 없다.

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write   # state/·docs/status.json 커밋용

jobs:
  paper:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 재학습 잡이 방금 커밋한 챔피언을 놓치지 않도록 최신 main을 받는다
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml scikit-learn yfinance ccxt

      - name: Daily paper crypto (BTC/USDT)
        run: |
          python -m quant paper-daily --market crypto --symbol BTC/USDT \
            | tee paper-crypto.txt

      - name: Daily paper us_stock (SPY)
        run: |
          python -m quant paper-daily --market us_stock --symbol SPY --docs \
            | tee paper-us-stock.txt

      - name: 결과 요약 (Actions Summary)
        if: always()
        run: |
          {
            echo "## 📅 매일 자동 페이퍼 결과"
            echo '```'
            cat paper-crypto.txt paper-us-stock.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 상태·사이트 커밋 (state/ + docs/status.json)
        run: |
          if [ -z "$(git status --porcelain state/ docs/status.json)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/status.json
          git commit -m "매일 자동 페이퍼 기록: $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "❌ 기록 푸시 실패"; exit 1
