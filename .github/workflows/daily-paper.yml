name: Daily Paper

# 매일 자동 페이퍼 운용 — 사용자가 아무것도 안 해도 매일 돌아간다.
# 매일 20:30 UTC(= 새벽 5:30 KST, nightly-retrain 30분 뒤 — 그날 승격된 챔피언을
# 바로 사용) 챔피언 전략으로 하루치 모의 매매를 하고, 계좌 상태(state/paper/)와
# 사이트용 요약(docs/status.json)을 커밋한다. docs/ 는 push 시 Cloudflare Pages로
# 자동 배포되므로 웹사이트만 열면 매일의 결과가 보인다.
#
# ⚠️ 페이퍼(모의) 운용이다 — 실제 돈이 오가지 않으며, 실거래 자동 전환은 없다.

on:
  schedule:
    - cron: "30 20 * * *"   # 본 실행 (새벽 5:30 KST)
    - cron: "0 22 * * *"    # 예비 재시도 — 이미 기록된 날은 멱등 가드가 건너뜀
  workflow_dispatch:

permissions:
  contents: write   # state/·docs/status.json 커밋용

jobs:
  paper:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 재학습 잡이 방금 커밋한 챔피언을 놓치지 않도록 최신 main을 받는다
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml scikit-learn yfinance ccxt pykrx

      - name: 시장 브리핑 수집 (표시 전용 — 판단 미사용)
        run: |
          # 실패해도 페이퍼 운용은 계속한다 — 브리핑은 참고 정보일 뿐이다
          python -m quant briefing || echo "브리핑 수집 실패 — 건너뜀"

      - name: Daily paper all targets (AUTO_TARGETS)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          QUANT_LIVE_URL: ${{ vars.QUANT_LIVE_URL }}
        run: |
          python -m quant paper-daily --all --docs | tee paper-all.txt

      - name: 주간 요약 (월요일 아침 KST, 텔레그램)
        # 20:30 UTC 실행 = KST 다음날 새벽 5:30 — 일요일(UTC 일=7) 실행분이
        # 한국의 월요일 아침에 도착하므로 UTC 요일 7에 보낸다.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 재시도 크론(0 22)에서는 보내지 않는다 — 주간 요약 중복 발송 방지
          if [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            echo "재시도 실행 — 주간 요약 건너뜀"
          elif [ "$(date -u +%u)" = "7" ]; then
            python -m quant weekly | tee weekly.txt
          else
            echo "월요일(KST) 아님 — 주간 요약 건너뜀"
          fi

      - name: 결과 요약 (Actions Summary)
        if: always()
        run: |
          {
            echo "## 📅 매일 자동 페이퍼 결과"
            echo '```'
            cat paper-all.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 공유 카드 이미지 생성 (오늘의 성적표 1200×630)
        # 러너에 기본 설치된 Chrome 헤드리스로 today.html을 캡처한다.
        # SNS 공유 미리보기(og:image)·쇼츠 썸네일용. 실패해도 운용은 계속.
        run: |
          (cd docs && python -m http.server 8777 >/dev/null 2>&1 &)
          sleep 2
          google-chrome --headless=new --disable-gpu --hide-scrollbars \
            --window-size=1200,630 --virtual-time-budget=6000 \
            --screenshot=docs/card.png \
            "http://127.0.0.1:8777/today.html?card=1" \
            && echo "카드 생성 완료" || echo "카드 생성 실패 — 건너뜀"

      - name: 상태·사이트 커밋 (state/ + docs/status.json)
        run: |
          if [ -z "$(git status --porcelain state/ docs/status.json docs/card.png)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/status.json
          git add docs/card.png 2>/dev/null || true
          git commit -m "매일 자동 페이퍼 기록: $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "❌ 기록 푸시 실패"; exit 1
      - name: 외부 하트비트 핑 (HEARTBEAT_URL 설정 시)
        # dead man's switch의 2중화 — 감시 잡도 GitHub Actions 위에 있어
        # GitHub 전체 장애는 못 잡는다. healthchecks.io류 외부 서비스에 성공
        # 핑을 보내면, 핑이 끊겼을 때 '외부에서' 경보가 온다. 시크릿
        # HEARTBEAT_URL 미설정이면 조용히 건너뛴다.
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS --max-time 20 --retry 3 "$HEARTBEAT_URL" >/dev/null \
              && echo "💓 하트비트 전송" || echo "하트비트 전송 실패 — 무시"
          else
            echo "HEARTBEAT_URL 미설정 — 건너뜀"
          fi

      - name: 실패 경보 (디스코드/텔레그램)
        # 잡이 어느 단계에서 죽어도 폰으로 알린다 — 조용한 고장이 가장 위험하다.
        # 파이썬 의존성 없이 curl만 사용(의존성 설치 전에 죽어도 동작).
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MSG="🚨 [Quant] '${{ github.workflow }}' 실패 ($(date -u +%F)) — 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"$MSG\"}" "$DISCORD_WEBHOOK_URL" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "경보 전송 시도 완료 (설정된 채널 없으면 무시)"
