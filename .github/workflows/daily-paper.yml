name: Daily Paper

# 매일 자동 페이퍼 운용 — 사용자가 아무것도 안 해도 매일 돌아간다.
# 매일 22:15 UTC(= 아침 7:15 KST, nightly-retrain 30분 뒤 — 그날 승격된 챔피언을
# 바로 사용) 챔피언 전략으로 하루치 모의 매매를 하고, 계좌 상태(state/paper/)와
# 사이트용 요약(docs/status.json)을 커밋한다. docs/ 는 push 시 Cloudflare Pages로
# 자동 배포되므로 웹사이트만 열면 매일의 결과가 보인다.
#
# ⚠️ 페이퍼(모의) 운용이다 — 실제 돈이 오가지 않으며, 실거래 자동 전환은 없다.

on:
  schedule:
    - cron: "15 22 * * *"   # 본 실행 (07:15 KST — 미국장 마감 후·한국 개장 전)
    # 예비 재시도 — 이미 기록된 날은 멱등 가드가 건너뛴다.
    #
    # ⚠️ **자정(UTC)에서 멀리 둔다**(2026-08-14 감사 232). 예전에는 23:15
    #    였는데, GitHub Actions가 43분 늦게 띄우자 23:58에 시작해 자정을
    #    넘겼다. 코인 일봉은 UTC 자정에 롤오버하므로 멱등 가드가 "새 날"로
    #    보고 **다음 날 기록을 미리 만들어 버렸다.** 그 기록의 주식은 하루
    #    묵은 봉으로 판단한 것이고(bar_age us_stock 1 · kr_stock 1),
    #    그러면 다음 날 정규 배치(22:15)는 같은 코인 봉을 보고 건너뛴다 —
    #    즉 **재시도가 다음 날을 선점해 묵은 판단으로 확정**해 버린다.
    #    22:30이면 정규 실행 15분 뒤이면서 자정까지 90분 여유가 있다.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write   # state/·docs/status.json 커밋용

# ⚠️ 알림은 **저장이 끝난 뒤에** 나간다(감사 283). 이 값이 켜져 있으면
#    배치는 알림을 보내지 않고 대기열에 쌓고, 커밋·푸시가 성공한 뒤
#    `quant notify --flush`가 그때 내보낸다. 관문에서 죽으면 대기열은
#    러너와 함께 사라진다 — 일어나지 않은 일은 방송하지 않는다.
env:
  QUANT_DEFER_NOTICE: "1"

jobs:
  paper:
    runs-on: ubuntu-latest
    # 매달림 방어(2026-08-11 감사 77) — 무제한이면 배치가 멈춘 채
    # 몇 시간을 태우고 로그도 안 남는다. 값은 실측 최대의 3배 이상.
    # ⚠️ 45분 유지(2026-08-19). 종목이 45개로 늘었지만 실측(최근 14회
    # 최대 4.1분) 대비 열 배 여유이고, 이보다 길어지면 '멈춘 것'으로
    # 보는 편이 맞다. 돈을 굴리는 배치는 짧게 묶는다.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 재학습 잡이 방금 커밋한 챔피언을 놓치지 않도록 최신 main을 받는다
          ref: main
          # 개선 이력 자동 발행(changelog)이 전체 커밋 이력을 읽는다.
          # 얕으면 발행기가 스스로 멈춘다(부분 이력이 전부로 읽히므로).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 버전 없이 설치하면 그날 PyPI 최신을 받는다 — 어느 날 메이저가
          # 올라오면 조용히 동작이 바뀐다(감사 130: pandas 3이 그렇게
          # 들어와 풀링 학습을 통째로 죽였고 몇 주 아무도 몰랐다).
          # requirements.txt 한 파일이 검사·실전을 함께 다스린다.
          pip install -r requirements.txt -r requirements-extra.txt

      - name: 시장 브리핑 수집 (표시 전용 — 판단 미사용)
        run: |
          # 실패해도 페이퍼 운용은 계속한다 — 브리핑은 참고 정보일 뿐이다
          python -m quant briefing || echo "브리핑 수집 실패 — 건너뜀"

      - name: Daily paper all targets (AUTO_TARGETS)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 한국 실적 발표일(DART, 2026-08-24) — 키가 있으면 일일 배치가
          # 주간 캐시를 채워 한국 PEAD·실적 가드 재료가 된다. 미설정이면
          # 빈 값이고 코드가 조용히 건너뛴다(키 조건부).
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          QUANT_LIVE_URL: ${{ vars.QUANT_LIVE_URL }}
        run: |
          python -m quant paper-daily --all --docs | tee paper-all.txt

      - name: 머신러닝 성적표 갱신 (docs/ml.json)
        # 종목별 장부가 갱신된 **뒤에** 센다 — 앞에 두면 어제 숫자를 오늘
        # 것이라 적는다. 실패해도 운용은 계속한다(표시 전용).
        run: |
          python -m quant ml-report --docs docs --state state \
            || echo "머신러닝 성적표 실패 — 건너뜀"

      - name: 주간 요약 (월요일 아침 KST, 텔레그램)
        # ⚠️ 요일 판정은 **KST로** 한다(감사 221). 예전에는 UTC 요일 7(일)로
        #    쟀는데, 배치가 22:30 UTC로 옮겨지면서 UTC 날짜와 KST 날짜가
        #    갈리는 구간이 달라졌다. "월요일 아침에 보낸다"가 계약이므로
        #    한국 시간으로 재는 것이 애초에 맞다.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # ⚠️ 예비 크론 문자열이 위 schedule 블록과 **여기 두 곳**에 있다.
          #    한쪽만 고치면 조건이 영영 안 맞아 주간 요약이 두 번 나간다 —
          #    tests/test_deadman_window.py가 두 값이 같은지 확인한다.
          # 재시도 크론에서는 보내지 않는다 — 주간 요약 중복 발송 방지
          if [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
            echo "재시도 실행 — 주간 요약 건너뜀"
          elif [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then
            python -m quant weekly | tee weekly.txt
          else
            echo "월요일(KST) 아님 — 주간 요약 건너뜀"
          fi

      - name: 결과 요약 (Actions Summary)
        if: always()
        run: |
          {
            echo "## 📅 매일 자동 페이퍼 결과"
            echo '```'
            cat paper-all.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 공유 카드 이미지 생성 (오늘의 성적표 1200×630)
        # 러너에 기본 설치된 Chrome 헤드리스로 today.html을 캡처한다.
        # SNS 공유 미리보기(og:image)·쇼츠 썸네일용. 실패해도 운용은 계속.
        run: |
          (cd docs && python -m http.server 8777 >/dev/null 2>&1 &)
          sleep 2
          google-chrome --headless=new --disable-gpu --hide-scrollbars \
            --window-size=1200,630 --virtual-time-budget=6000 \
            --screenshot=docs/card.png \
            "http://127.0.0.1:8777/today.html?card=1" \
            && echo "카드 생성 완료" || echo "카드 생성 실패 — 건너뜀"

      - name: 상태·사이트 커밋 (state/ + docs/status.json)
        run: |
          if [ -z "$(git status --porcelain state/ docs/status.json docs/card.png docs/ml.json)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/status.json docs/changelog.json docs/ml.json
          git add docs/card.png 2>/dev/null || true
          # 장부 관문(감사 255) — 방금 쓴 기록이 말이 되는지 커밋 **전에** 본다.
          # 배치 커밋은 [skip actions]라 CI가 안 붙는다. 그 구멍으로
          # 2026-08-15의 +7,150%가 반나절을 살아남았다. 실패하면 커밋하지
          # 않는다 — 오염된 기록은 내일의 출발 상태이기도 하다.
          python scripts/ledger_gate.py
          git commit -m "매일 자동 페이퍼 기록: $(date -u +%F) [skip actions]"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              # ⚠️ **저장이 끝난 뒤에야 방송한다**(감사 283). 배치는
              #    ①계산 →②알림 →③장부 관문 →④커밋 순서였고, ③에서
              #    죽으면 ②는 이미 나간 뒤였다. 2026-08-17 밤 실제로 그랬다 —
              #    폰에는 "자산 999,078원", "챔피언 교체 SPY·QQQ"가 남았는데
              #    장부에는 그런 일이 없다. 관문에서 죽으면 대기열은 러너와
              #    함께 사라지고 실패 경보만 나간다.
              python -m quant notify --flush || true
              exit 0
            fi
            sleep $((2**i))
          done
          echo "❌ 기록 푸시 실패"; exit 1
      - name: 외부 하트비트 핑 (HEARTBEAT_URL 설정 시)
        # dead man's switch의 2중화 — 감시 잡도 GitHub Actions 위에 있어
        # GitHub 전체 장애는 못 잡는다. healthchecks.io류 외부 서비스에 성공
        # 핑을 보내면, 핑이 끊겼을 때 '외부에서' 경보가 온다. 시크릿
        # HEARTBEAT_URL 미설정이면 조용히 건너뛴다.
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS --max-time 20 --retry 3 "$HEARTBEAT_URL" >/dev/null \
              && echo "💓 하트비트 전송" || echo "하트비트 전송 실패 — 무시"
          else
            echo "HEARTBEAT_URL 미설정 — 건너뜀"
          fi

      - name: 실패 경보 (디스코드/텔레그램)
        # 잡이 어느 단계에서 죽어도 폰으로 알린다 — 조용한 고장이 가장 위험하다.
        # 파이썬 의존성 없이 curl만 사용(의존성 설치 전에 죽어도 동작).
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MSG="🚨 [Quant] '${{ github.workflow }}' 실패 ($(date -u +%F)) — 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"$MSG\"}" "$DISCORD_WEBHOOK_URL" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "경보 전송 시도 완료 (설정된 채널 없으면 무시)"
