name: Weekly Report

# 주간 건강 보고서 — 매주 월요일 아침 8시 KST(일 23:00 UTC)에 발송한다.
#
# ⚠️ 이 워크플로가 없던 것이 2026-08-11 감사에서 나온 결함이다. `quant weekly`
#    명령은 오래전부터 있었고, 알림 채널 배선도 끝나 있었고, 킬스위치·판정
#    시계·체결 가정 검증까지 담도록 확장까지 해뒀는데 — **어떤 워크플로도
#    실행하지 않았다.** 사장님이 직접 명령을 치지 않으면 영원히 오지 않는
#    보고서였다. 만들어 놓고 아무도 부르지 않는 기능은 없는 기능과 같다.
#
# 왜 월요일 아침인가: 주말 동안 코인은 계속 돌고 주식은 멈춘다. 월요일
# 아침이면 지난주가 확정된 뒤이고, 한 주를 시작하며 상태를 확인하기 좋다.

on:
  schedule:
    - cron: "0 23 * * 0"     # 일요일 23:00 UTC = 월요일 08:00 KST
  workflow_dispatch:

# 최소 권한 명시 — 미지정이면 저장소 기본값(조직 설정에 따라
# write-all일 수 있다)을 물려받는다. 워크플로가 필요한 만큼만 갖게 한다.
# 장부를 읽어 알림만 보낸다 — 쓰기 권한이 필요 없다.
permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    # 매달림 방어(2026-08-11 감사 77) — 무제한이면 배치가 멈춘 채
    # 몇 시간을 태우고 로그도 안 남는다. 값은 실측 최대의 3배 이상.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 버전 없이 설치하면 그날 PyPI 최신을 받는다 — 어느 날 메이저가
          # 올라오면 조용히 동작이 바뀐다(감사 130: pandas 3이 그렇게
          # 들어와 풀링 학습을 통째로 죽였고 몇 주 아무도 몰랐다).
          # requirements.txt 한 파일이 검사·실전을 함께 다스린다.
          pip install -r requirements.txt

      - name: 주간 건강 보고서 발송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -m quant weekly | tee weekly.txt
          # 기록이 없으면 보고서가 '📭 지난주 페이퍼 기록이 없습니다'로 나온다.
          # 그것도 사건이다 — 조용히 넘기지 않고 잡을 실패시켜 알린다.
          if grep -q "📭" weekly.txt; then
            echo "❌ 지난주 페이퍼 기록이 없다 — 새벽 배치가 돌지 않았을 수 있다"
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_id }}
          path: weekly.txt
          if-no-files-found: ignore

      - name: 실패 경보 (디스코드/텔레그램)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MSG="🚨 [Quant] 주간 보고서 실패 ($(date -u +%F)) — 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"$MSG\"}" "$DISCORD_WEBHOOK_URL" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "경보 전송 시도 완료 (설정된 채널 없으면 무시)"
