name: Recover Missing Bars

# 빠진 봉을 **다시 계산해서** 채운다 — 손으로 돌리는 일회성 잡이다.
#
# ⚠️ 왜 필요했나 (2026-08-19, 사장님 지시 "사흘 기록 채워줘").
#    08-16·17·18 사흘 동안 배치가 계산은 끝내 놓고 커밋을 못 했다. 셋 다
#    관문에 막혔는데 이유가 달랐다(판정일 뒷걸음 · 브라우저 · 새 필드).
#    08-17·18은 시스템이 실제로 낸 판단이 있고 저장만 못 했다.
#
# ⚠️ **손으로 숫자를 적지 않는다.** 그날 봉까지만 잘라 같은 계산을 다시
#    돌리고, 그날 로그에 찍힌 자산으로 검산한다. 다르면 아무것도 남기지
#    않는다 — 검산 없는 복원은 그냥 새 계산이고, 새 계산에 옛 날짜를
#    붙이면 그게 지어낸 기록이다.
#
# ⚠️ 이 개발 컨테이너에서는 못 돌린다. 프록시가 시세 서버를 막아 전부
#    합성 데이터로 폴백하기 때문이다. 여기(러너)는 바깥이 열려 있다.
#
# 예정 실행은 없다 — 필요할 때 사람이 누른다.

on:
  workflow_dispatch:
    inputs:
      bars:
        description: "되살릴 봉(쉼표) 예: 2026-08-17,2026-08-18"
        required: true
      expects:
        description: "그날 로그의 자산(쉼표·같은 순서) 예: 999267.50,1000116.77"
        required: true
      crypto_asof:
        description: "코인만 다른 날로 자를 때(쉼표·같은 순서·빈칸 허용) 예: 2026-03-04,"
        required: false
        default: ""
      write:
        description: "검산을 통과하면 장부에 남긴다"
        type: boolean
        default: false

permissions:
  contents: write

# 알림은 저장이 끝난 뒤에만 나간다(감사 283·287) — 되살리기가 검산에서
# 멈추면 아무 말도 나가지 않는다.
env:
  QUANT_DEFER_NOTICE: "1"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-extra.txt

      - name: 되살리기 (검산 포함)
        # ⚠️ 사용자 입력은 **셸에 펼치지 않는다.** env로 넘기고 "$VAR"로
        #    쓴다 — 봉 날짜 칸에 셸 명령을 적어 넣는 공격을 막는다
        #    (tests/test_workflow_injection.py가 저장소 규칙으로 못 박았다).
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          QUANT_LIVE_URL: ${{ vars.QUANT_LIVE_URL }}
          IN_BARS: ${{ inputs.bars }}
          IN_EXPECTS: ${{ inputs.expects }}
          IN_CASOF: ${{ inputs.crypto_asof }}
          IN_WRITE: ${{ inputs.write }}
        run: |
          WRITE=""
          if [ "$IN_WRITE" = "true" ]; then WRITE="--write"; fi
          python3 scripts/recover_missing_bars.py \
            --bars "$IN_BARS" --expects "$IN_EXPECTS" \
            --crypto-asofs "$IN_CASOF" $WRITE | tee recover.txt

      - name: 장부 관문 통과 후에만 커밋
        if: ${{ inputs.write }}
        env:
          IN_BARS: ${{ inputs.bars }}
        run: |
          if [ -z "$(git status --porcelain state/ docs/status.json)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/status.json
          python scripts/ledger_gate.py
          git commit -m "빠진 봉 되살림: $IN_BARS — 그날 로그와 검산 일치 [skip actions]"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              # ⚠️ 여기서는 **보내지 않고 버린다**(감사 283·287의 반대편).
              #    되살린 봉의 알림은 "오늘 자산 999,267원"처럼 읽힌다 —
              #    이미 지나간 날 이야기를 오늘 일처럼 방송하는 셈이다.
              #    저장은 됐지만 방송할 소식은 아니다. 되살렸다는 사실은
              #    기록 검증 페이지에 적는다.
              python -m quant notify --discard || true
              exit 0
            fi
            sleep $((2**i))
          done
          echo "❌ 푸시 실패"; exit 1

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🔁 빠진 봉 되살리기"
            echo '```'
            cat recover.txt 2>/dev/null || echo "실행 로그 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
