name: Dead Man's Switch

# 조용한 실패 감시 — 가장 위험한 실패는 '실행되지 않은 실패'다.
# 배치 잡이 죽으면 자체 실패 경보가 울리지만, 크론이 아예 안 돌면(러너 장애·
# 스케줄 누락·저장소 설정 변경) 어떤 경보도 없다 — 장부가 조용히 멈춘다.
# 그래서 독립된 감시 잡이 매일 아침(10:30 KST, 모든 배치·재시도가 끝난 뒤)
# "지난 24시간 안에 야간 재학습·매일 페이퍼·SNS 콘텐츠 커밋이 실제로 존재하는가"
# 를 결과물로 확인한다. 실행 여부가 아니라 기록의 존재를 보는 이유: 우리가 지키
# 려는 것은 잡의 가동이 아니라 장부의 연속성이다.
#
# ⚠️ 창과 시각을 2026-08-12에 고쳤다(감사 104) — 그 전에는 **SNS 항목이
#    하루짜리 누락을 구조적으로 못 잡았다.**
#      SNS 커밋:  22:45 UTC 실행 → 약 23:19 UTC 커밋
#      감시 실행: 23:30 UTC 예약 → 실측 23:56~00:01 UTC (크론 지연)
#      26시간 창 시작: 약 21:56 UTC (전날)
#    즉 **어제 SNS 커밋(23:19)이 창 안에 1.3시간 여유로 들어온다.** 오늘
#    SNS 게시가 죽어도 어제 것으로 통과한다 — 실제로 2026-08-11 밤 게시가
#    numpy 오류로 죽었는데 감시는 초록이 될 상황이었다. 감시가 감시를 못 한다.
#    고침: 실행을 01:30 UTC(10:30 KST)로 늦추고 창을 24시간으로 좁혔다.
#      → 창 시작 ≈ 01:56 UTC 당일. 어제 커밋(23:19 전날)은 창 **밖**,
#        오늘 커밋(20:1x~23:19)은 창 **안**(여유 18~21시간).
#      → 크론이 1시간 지연돼도 판정이 뒤집히지 않는다.
#
# 한계(정직): 이 감시 잡 자체도 GitHub Actions 위에 있다 — GitHub 전체 장애
# 는 못 잡는다(그날은 배치도 같이 멈추므로 다음 실행에서 24시간 창에 걸린다).

on:
  schedule:
    # 10:30 KST — 마지막 배치(SNS 22:45 UTC)보다 2시간 이상 뒤.
    # ⚠️ 이 값을 앞당기면 위에 적은 하루짜리 맹점이 되살아난다.
    #    tests/test_deadman_window.py가 크론과 창을 함께 검사한다.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 매달림 방어(2026-08-11 감사 77) — 무제한이면 배치가 멈춘 채
    # 몇 시간을 태우고 로그도 안 남는다. 값은 실측 최대의 3배 이상.
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 300   # 24시간 창의 커밋을 충분히 담는 깊이

      - name: 장부 연속성 확인 (지난 24시간)
        id: probe
        env:
          QUANT_LIVE_URL: ${{ vars.QUANT_LIVE_URL }}
        run: |
          # ⚠️ 파이프 금지 — git log 출력을 곧장 grep -q로 파이프하면
          # pipefail 아래에서 grep이 매치를 찾는 순간 상류가 SIGPIPE로 죽어
          # 파이프라인이 '실패'가 된다("찾았기 때문에 못 찾았다"는 오탐 —
          # 2026-08-09 첫 실행의 실제 사고). 변수로 받아 히어스트링으로 검사.
          LOG="$(git log --since="24 hours ago" --pretty=%s)"
          MISSING=""
          if ! grep -q "야간 재학습 기록" <<< "$LOG"; then
            MISSING="야간재학습"
          fi
          if ! grep -q "매일 자동 페이퍼 기록" <<< "$LOG"; then
            MISSING="$MISSING 매일페이퍼"
          fi
          if ! grep -q "SNS 게시 콘텐츠" <<< "$LOG"; then
            MISSING="$MISSING SNS콘텐츠"
          fi
          # 사이트 반영 신선도 — 커밋은 됐는데 배포가 죽은 경우를 잡는다.
          # 배포된 status.json의 updated가 최근 2일 안이어야 정상.
          # ⚠️ 배치 커밋이 "[skip ci]"를 달면 Cloudflare도 배포를 건너뛰어
          # 개발 푸시가 없는 날 사이트가 조용히 낡는다(2026-08-10 실제 사고)
          # — 그래서 배치 커밋은 "[skip actions]"(GitHub만 스킵)를 쓴다.
          # 접속 실패와 내용 낡음은 원인이 다르므로 라벨을 구분한다.
          URL="${QUANT_LIVE_URL:-https://quant.jiwon-1a2.workers.dev}"
          TODAY="$(date -u +%F)"; YDAY="$(date -u -d '1 day ago' +%F)"
          SITE="$(curl -sf --max-time 30 "$URL/status.json" || true)"
          if [ -z "$SITE" ]; then
            MISSING="$MISSING 사이트접속불가"
          elif ! grep -q -e "$TODAY" -e "$YDAY" <<< "$SITE"; then
            MISSING="$MISSING 사이트반영낡음"
          fi
          MISSING="$(echo "$MISSING" | xargs)"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ -n "$MISSING" ]; then
            echo "🚨 누락: $MISSING"
            exit 1
          fi
          echo "✅ 배치 기록·사이트 반영 모두 확인 — 장부 연속성 정상"

      - name: 🚨 dead man's switch 경보 (디스코드/텔레그램)
        # 파이썬 의존성 없이 curl만 사용 — 경보 경로는 최대한 단순해야 한다.
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MISSING: ${{ steps.probe.outputs.missing }}
        run: |
          MSG="🚨 [Quant] dead man's switch — 지난 24시간 내 [${MISSING:-확인 불가}] 기록 커밋 없음. 새벽 배치가 실행되지 않았거나 푸시에 실패했습니다. 확인: https://github.com/${{ github.repository }}/actions"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"$MSG\"}" "$DISCORD_WEBHOOK_URL" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "경보 전송 시도 완료 (웹훅 미설정이면 로그만 남음)"
