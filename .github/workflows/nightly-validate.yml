name: Nightly Validate

# 야간 실데이터 회귀 — 매일 19:00 UTC(= 새벽 4시 KST)에 실데이터로 검증 3종
# (워크포워드+DSR · PBO · CPCV)을 돌린다.
#
# 왜 폴백 검사가 먼저인가: 데이터 제공자는 네트워크/API 실패 시 합성 데이터로
# '조용히' 폴백한다(개발 편의). 야간 회귀가 폴백 위에서 돌면 초록불이어도
# 아무것도 검증한 게 아니다 — 실데이터 없이 하는 검증은 무의미하다. 그래서
# validate 전에 attrs["synthetic_fallback"]을 확인해 폴백이면 잡을 크게 실패시킨다.
#
# 스케줄 잡의 실패는 PR을 게이트하지 않는다(리포트·조기경보 용도).
# ⚠️ 세 검증을 모두 통과해도 미래 수익은 보장되지 않는다.

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 명시적 bash → pipefail 활성화. `python … | tee`에서 python 쪽 실패가
        # tee의 성공에 가려지지 않게 한다.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ci.yml의 핵심 의존성 + 실데이터 소스(yfinance: 주식, ccxt: 코인)
          pip install pandas numpy pyyaml scikit-learn pytest cryptography yfinance ccxt

      - name: 실데이터 확인 (합성 폴백이면 즉시 실패)
        # CLI 출력만으로는 폴백 여부를 알 수 없으므로(attrs는 CLI 밖) 여기서
        # 직접 데이터를 받아 attrs["synthetic_fallback"]을 검사한다.
        run: |
          python - <<'PY'
          from quant.data import get_provider

          for market, symbol in (("crypto", "BTC/USDT"), ("us_stock", "SPY")):
              df = get_provider(market).get_ohlcv(symbol, "1d", limit=800)
              if df.attrs.get("synthetic_fallback"):
                  raise SystemExit(
                      f"❌ {market}/{symbol}: 실데이터 수신 실패 → 합성 폴백 감지. "
                      "실데이터 없이 검증은 무의미하므로 잡을 실패시킵니다. "
                      "(데이터 소스/네트워크 상태를 확인하세요)")
              print(f"✅ {market}/{symbol}: 실데이터 {len(df)}봉 수신")
          PY

      # ⚠️ 실제로 굴리는 전략을 검증한다. 예전에는 --strategy ma_cross를
      #    검증했는데, 챔피언은 20종목 전부 ml이었다 — 아무도 안 쓰는 전략을
      #    검증하는 과최적화 감시는 감시가 아니다(2026-08-11 발견).
      - name: Validate crypto (BTC/USDT · 실전 전략 ml)
        continue-on-error: false
        run: |
          python -m quant validate --market crypto --symbol BTC/USDT \
            --strategy ml --limit 800 --save state/validation.json \
            | tee validate-crypto.txt

      - name: Validate us_stock (SPY · 실전 전략 ml)
        continue-on-error: false
        run: |
          python -m quant validate --market us_stock --symbol SPY \
            --strategy ml --limit 800 --save state/validation.json \
            | tee validate-us-stock.txt

      # 재현성 감사 — 어제의 재학습 결정을 저장된 스냅샷으로 되돌려 같은
      # 결론이 나오는지 확인한다.
      #
      # ⚠️ 이 단계가 없던 것이 2026-08-11 감사에서 나온 결함이다. verify 명령은
      #    처음부터 있었지만 **어떤 워크플로도 실행하지 않았다** — 사이트가
      #    "판단·장부·코드가 공개돼 누구든 검증할 수 있다"고 말하는 동안,
      #    그 검증은 한 번도 돌아본 적이 없었다. 돌지 않는 검증은 깨져도
      #    아무도 모르고, 깨진 줄 모르는 검증은 검증이 아니라 장식이다.
      #
      # 실패해도 잡을 죽이지 않는다(continue-on-error): 옛 기록은 스냅샷이나
      # champion_before가 없어 '재현 불가'가 정상이다. 대신 결과를 그대로
      # 남기고, 아래 경보 단계가 '불일치'만 골라 알린다.
      - name: 재현성 감사 (어제 결정을 스냅샷으로 재현)
        id: repro
        continue-on-error: true
        # 한 종목 재현에 십수 분이 걸린다(풀링 후보 23개 × 워크포워드).
        # 전 종목은 몇 시간이라 매일 돌릴 수 없으므로 날짜 시드로 1종목씩
        # 회전 감사한다 — 3주면 전 종목을 한 바퀴 돈다. 자른 사실은 출력에
        # 그대로 남는다(조용한 표본 축소 금지).
        timeout-minutes: 35
        run: |
          d=$(date -u -d "yesterday" +%F)
          echo "대상 날짜: $d"
          python -m quant verify --date "$d" --sample 1 | tee verify.txt

      - name: 재현 불일치 경보
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          try:
              text = open("verify.txt", encoding="utf-8").read()
          except OSError:
              raise SystemExit("verify.txt 없음 — 재현 감사가 실행되지 않았다")
          lines = text.splitlines()
          # 결과 줄이 하나도 없으면 감사가 '조용히 죽은' 것이다 — 통과로
          # 읽으면 안 된다. 돌지 않은 검증이 정확히 이번에 잡은 결함이다.
          if not any(("✔" in ln or "✘" in ln) for ln in lines):
              raise SystemExit("재현 감사 출력 없음 — verify가 실행되지 못했다\n"
                               + text[-2000:])
          # '스냅샷 없음'·'구버전 기록'은 옛 기록의 정상적 한계라 경보 제외.
          # 결정이 달라진 것(불일치)만이 진짜 사건이다.
          bad = [ln for ln in lines if "불일치" in ln or "재현 실패" in ln]
          if not bad:
              print("✅ 재현 감사 통과(또는 대상 없음)")
              raise SystemExit(0)
          from quant.live.notifications import get_notifier
          get_notifier().send(
              "🚨 재현성 감사 불일치 — 같은 스냅샷·같은 코드로 어제 결정이 "
              "재현되지 않았습니다. 장부의 '조작 불가능' 주장이 걸린 문제라 "
              "즉시 확인이 필요합니다.\n" + "\n".join(bad[:10]))
          raise SystemExit("재현 불일치: " + " | ".join(bad[:5]))
          PY

      # 검증 결과를 장부에 커밋한다 — 아티팩트는 만료되고, 만료되는 증거는
      # 감시가 아니다. 커밋된 값을 flag_watch가 매일 읽어 과최적화를 경보한다.
      - name: 검증 결과 커밋 (state/validation.json)
        if: success()
        run: |
          if [ -n "$(git status --porcelain state/validation.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/validation.json
            git commit -m "야간 검증 기록: $(date -u +%F) [skip actions]"
            git push
          else
            echo "검증 결과 변화 없음 — 커밋 생략"
          fi

      - name: Upload validate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-${{ github.run_id }}
          path: |
            validate-crypto.txt
            validate-us-stock.txt
          if-no-files-found: ignore
      - name: 실패 경보 (디스코드/텔레그램)
        # 잡이 어느 단계에서 죽어도 폰으로 알린다 — 조용한 고장이 가장 위험하다.
        # 파이썬 의존성 없이 curl만 사용(의존성 설치 전에 죽어도 동작).
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MSG="🚨 [Quant] '${{ github.workflow }}' 실패 ($(date -u +%F)) — 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"$MSG\"}" "$DISCORD_WEBHOOK_URL" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "경보 전송 시도 완료 (설정된 채널 없으면 무시)"
