name: Nightly Validate

# 야간 실데이터 회귀 — 매일 20:15 UTC(= 05:15 KST)에 실데이터로 검증 3종
# (워크포워드+DSR · PBO · CPCV)을 돌린다.
#
# 왜 폴백 검사가 먼저인가: 데이터 제공자는 네트워크/API 실패 시 합성 데이터로
# '조용히' 폴백한다(개발 편의). 야간 회귀가 폴백 위에서 돌면 초록불이어도
# 아무것도 검증한 게 아니다 — 실데이터 없이 하는 검증은 무의미하다. 그래서
# validate 전에 attrs["synthetic_fallback"]을 확인해 폴백이면 잡을 크게 실패시킨다.
#
# 스케줄 잡의 실패는 PR을 게이트하지 않는다(리포트·조기경보 용도).
# ⚠️ 세 검증을 모두 통과해도 미래 수익은 보장되지 않는다.

on:
  schedule:
    - cron: "15 20 * * *"
  workflow_dispatch:

# 최소 권한 명시 — 미지정이면 저장소 기본값(조직 설정에 따라
# write-all일 수 있다)을 물려받는다. 워크플로가 필요한 만큼만 갖게 한다.
# state/validation.json을 커밋한다.
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    # 매달림 방어(2026-08-11 감사 77) — 무제한이면 배치가 멈춘 채
    # 몇 시간을 태우고 로그도 안 남는다. 값은 실측 최대의 3배 이상.
    # 2종목 → 20종목으로 늘리며 상향(2026-08-14). 실측: ml 1종목 49초
    # (800봉·그리드 4조합) → 20종목 ~17분. 러너가 느린 경우를 3배로 잡아도
    # 60분 안이지만, 재현성 감사까지 같은 잡에 있으므로 여유를 둔다.
    # 상한(120분)은 tests/test_workflow_timeouts.py가 강제한다 —
    # 지나치게 크면 '매달림 방어'가 의미를 잃는다.
    timeout-minutes: 120
    defaults:
      run:
        # 명시적 bash → pipefail 활성화. `python … | tee`에서 python 쪽 실패가
        # tee의 성공에 가려지지 않게 한다.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ci.yml의 핵심 의존성 + 실데이터 소스(yfinance: 주식, ccxt: 코인)
          # 검사도 실전과 **같은 파일**로 설치한다(감사 130) — 두 환경이
          # 갈라지면 한쪽에만 있는 결함은 다른 쪽에서 안 보인다.
          pip install -r requirements.txt -r requirements-extra.txt

      - name: 실데이터 확인 (합성 폴백이면 즉시 실패)
        # CLI 출력만으로는 폴백 여부를 알 수 없으므로(attrs는 CLI 밖) 여기서
        # 직접 데이터를 받아 attrs["synthetic_fallback"]을 검사한다.
        #
        # ⚠️ 종목 목록을 여기 손으로 적지 않는다(2026-08-14). 예전에는
        #    ("crypto","BTC/USDT")·("us_stock","SPY") 두 줄이 박혀 있었고,
        #    운용이 8종목 → 20종목으로 늘 때 이 파일은 따라가지 않았다.
        #    나머지 18종목은 PBO·DSR이 한 번도 계산된 적이 없었는데 제품
        #    문서는 "검증을 통과한 전략만 씁니다"라고 말하고 있었다.
        run: |
          python - <<'PY'
          from quant.data import get_provider
          from quant.markets import AUTO_TARGETS

          bad = []
          for market, symbol in AUTO_TARGETS:
              try:
                  df = get_provider(market).get_ohlcv(symbol, "1d", limit=800)
              except Exception as exc:
                  bad.append(f"{market}/{symbol}: {type(exc).__name__}: {exc}")
                  continue
              if df.attrs.get("synthetic_fallback"):
                  bad.append(f"{market}/{symbol}: 합성 폴백 감지")
                  continue
              print(f"✅ {market}/{symbol}: 실데이터 {len(df)}봉 수신")
          if bad:
              raise SystemExit(
                  "❌ 실데이터 수신 실패 — 실데이터 없이 검증은 무의미하므로 "
                  "잡을 실패시킵니다:\n  " + "\n  ".join(bad))
          PY

      # ⚠️ 실제로 굴리는 전략을 검증한다. 예전에는 --strategy ma_cross를
      #    검증했는데, 챔피언은 20종목 전부 ml이었다 — 아무도 안 쓰는 전략을
      #    검증하는 과최적화 감시는 감시가 아니다(2026-08-11 발견).
      #
      # --all은 quant.markets.AUTO_TARGETS를 돈다. 운용 종목을 늘리면 검증도
      # 자동으로 따라온다 — 목록이 두 곳에 있으면 반드시 갈라진다.
      - name: Validate 전 종목 (운용 대상 전체 · 실전 전략 ml)
        continue-on-error: false
        run: |
          python -m quant validate --all \
            --strategy ml --limit 800 --save state/validation.json \
            | tee validate-all.txt

      # 재현성 감사 — 어제의 재학습 결정을 저장된 스냅샷으로 되돌려 같은
      # 결론이 나오는지 확인한다.
      #
      # ⚠️ 이 단계가 없던 것이 2026-08-11 감사에서 나온 결함이다. verify 명령은
      #    처음부터 있었지만 **어떤 워크플로도 실행하지 않았다** — 사이트가
      #    "판단·장부·코드가 공개돼 누구든 검증할 수 있다"고 말하는 동안,
      #    그 검증은 한 번도 돌아본 적이 없었다. 돌지 않는 검증은 깨져도
      #    아무도 모르고, 깨진 줄 모르는 검증은 검증이 아니라 장식이다.
      #
      # 실패해도 잡을 죽이지 않는다(continue-on-error): 옛 기록은 스냅샷이나
      # champion_before가 없어 '재현 불가'가 정상이다. 대신 결과를 그대로
      # 남기고, 아래 경보 단계가 '불일치'만 골라 알린다.
      - name: 재현성 감사 (어제 결정을 스냅샷으로 재현)
        id: repro
        continue-on-error: true
        # 한 종목 재현에 십수 분이 걸린다(풀링 후보 23개 × 워크포워드).
        # 전 종목은 몇 시간이라 매일 돌릴 수 없으므로 날짜 시드로 1종목씩
        # 회전 감사한다 — 3주면 전 종목을 한 바퀴 돈다. 자른 사실은 출력에
        # 그대로 남는다(조용한 표본 축소 금지).
        timeout-minutes: 35
        run: |
          d=$(date -u -d "yesterday" +%F)
          echo "대상 날짜: $d"
          python -m quant verify --date "$d" --sample 1 | tee verify.txt

      - name: 재현 불일치 경보
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        # ⚠️ 판단 로직을 YAML에 두지 않는다(2026-08-11 감사 103). 여기 있던
        #    `bad = [ln for ln in lines if "불일치" in ln ...]`가 **통과 줄의
        #    설명문**("… — 불일치 시 조작이 아니라 라이브러리 버전 차이일 수
        #    있음")에 걸려 ✔인 날에도 매일 경보를 울렸다. YAML 안에 있어서
        #    검사를 쓸 수 없었던 것이 원인이다.
        #    scripts/verify_gate.py + tests/test_verify_gate.py로 옮겼다.
        run: python3 scripts/verify_gate.py verify.txt

      # 위험 리포트 — 위기 재생 + 스트레스 시나리오. 스트레스는 '지금 노출'
      # 기준이라 하루만 지나도 낡으므로 매일 다시 계산한다. 실패해도 검증
      # 전체를 막지 않는다(|| 가 아니라 continue-on-error — 실패가 로그에
      # 실패로 남아야 한다. || true는 실패를 성공으로 바꿔 버린다).
      - name: 위험 리포트 (docs/risk.json)
        if: success()
        continue-on-error: true
        run: python3 scripts/risk_report.py

      # 검증 결과를 장부에 커밋한다 — 아티팩트는 만료되고, 만료되는 증거는
      # 감시가 아니다. 커밋된 값을 flag_watch가 매일 읽어 과최적화를 경보한다.
      - name: 검증 결과 커밋 (state/validation.json)
        if: success()
        run: |
          if [ -n "$(git status --porcelain state/validation.json docs/risk.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/validation.json docs/risk.json
            git commit -m "야간 검증 기록: $(date -u +%F) [skip actions]"
            git push
          else
            echo "검증 결과 변화 없음 — 커밋 생략"
          fi

      - name: Upload validate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-${{ github.run_id }}
          path: |
            validate-all.txt
          if-no-files-found: ignore
      - name: 실패 경보 (디스코드/텔레그램)
        # 잡이 어느 단계에서 죽어도 폰으로 알린다 — 조용한 고장이 가장 위험하다.
        # 파이썬 의존성 없이 curl만 사용(의존성 설치 전에 죽어도 동작).
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MSG="🚨 [Quant] '${{ github.workflow }}' 실패 ($(date -u +%F)) — 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"$MSG\"}" "$DISCORD_WEBHOOK_URL" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "경보 전송 시도 완료 (설정된 채널 없으면 무시)"
