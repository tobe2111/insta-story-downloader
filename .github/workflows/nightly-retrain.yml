name: Nightly Retrain

# 야간 자동 재학습 — 매일 21:15 UTC(= 06:15 KST, nightly-validate 1시간 뒤)에
# 실데이터로 챔피언/챌린저 2단계 검증을 돌리고, 결정 기록(state/)을 저장소에
# 커밋한다. 챔피언 교체는 '선발전+결승전'을 모두 통과한 후보가 있을 때만 일어난다.
#
# ⚠️ 대부분의 밤에는 "챔피언 유지"가 정상이다 — 재학습은 성공률을 계속 올리는
# 장치가 아니라, 시장 변화에 뒤처지지 않게 하고 검증된 개선만 반영하는 장치다.

on:
  schedule:
    - cron: "15 21 * * *"   # 본 실행 (06:15 KST — 미국장 마감 후)
    - cron: "45 22 * * *"   # 예비 재시도 — 본 실행이 성공했으면 멱등 가드가 건너뜀
  workflow_dispatch:

permissions:
  contents: write   # state/ 결정 기록을 main에 커밋하기 위함

# ⚠️ 알림은 **저장이 끝난 뒤에** 나간다(감사 283). 이 값이 켜져 있으면
#    배치는 알림을 보내지 않고 대기열에 쌓고, 커밋·푸시가 성공한 뒤
#    `quant notify --flush`가 그때 내보낸다. 관문에서 죽으면 대기열은
#    러너와 함께 사라진다 — 일어나지 않은 일은 방송하지 않는다.
env:
  QUANT_DEFER_NOTICE: "1"

jobs:
  retrain:
    runs-on: ubuntu-latest
    # 매달림 방어(2026-08-11 감사 77) — 무제한이면 배치가 멈춘 채
    # 몇 시간을 태우고 로그도 안 남는다. 값은 실측 최대의 3배 이상.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 버전 없이 설치하면 그날 PyPI 최신을 받는다 — 어느 날 메이저가
          # 올라오면 조용히 동작이 바뀐다(감사 130: pandas 3이 그렇게
          # 들어와 풀링 학습을 통째로 죽였고 몇 주 아무도 몰랐다).
          # requirements.txt 한 파일이 검사·실전을 함께 다스린다.
          pip install -r requirements.txt -r requirements-extra.txt

      - name: 실데이터 확인 (합성 폴백이면 즉시 실패)
        # 가짜 데이터로 재학습·승격하면 안 된다 — retrain 자체도 폴백을 거부하지만
        # 여기서 먼저 확인해 실패 원인을 명확히 남긴다.
        run: |
          python - <<'PY'
          from quant.data import get_provider

          for market, symbol in (("crypto", "BTC/USDT"), ("us_stock", "SPY")):
              df = get_provider(market).get_ohlcv(symbol, "1d", limit=800)
              if df.attrs.get("synthetic_fallback"):
                  raise SystemExit(
                      f"❌ {market}/{symbol}: 실데이터 수신 실패 → 합성 폴백 감지. "
                      "재학습을 중단합니다.")
              print(f"✅ {market}/{symbol}: 실데이터 {len(df)}봉 수신")
          PY

      - name: Retrain all targets (AUTO_TARGETS)
        # 대상 목록은 quant/markets.py AUTO_TARGETS 단일 출처 — 한 종목의
        # 실패는 건너뛰고 전 종목 실패 시에만 잡이 실패한다(조기 경보).
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m quant retrain --all --limit 800 | tee retrain-all.txt

      - name: 결과 요약 (Actions Summary)
        if: always()
        run: |
          {
            echo "## 🌙 야간 재학습 결과"
            echo '```'
            cat retrain-all.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결정 기록 커밋 (state/)
        run: |
          if git diff --quiet -- state/ && [ -z "$(git status --porcelain state/)" ]; then
            echo "state/ 변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          # 장부 관문(감사 255) — 방금 쓴 기록이 말이 되는지 커밋 **전에** 본다.
          # 배치 커밋은 [skip actions]라 CI가 안 붙는다. 그 구멍으로
          # 2026-08-15의 +7,150%가 반나절을 살아남았다. 실패하면 커밋하지
          # 않는다 — 오염된 기록은 내일의 출발 상태이기도 하다.
          python scripts/ledger_gate.py
          git commit -m "야간 재학습 기록: $(date -u +%F) 챔피언 결정 [skip actions]"
          # 다른 커밋과 경합할 수 있으므로 리베이스 후 푸시(최대 4회 재시도)
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              # ⚠️ **저장이 끝난 뒤에야 방송한다**(감사 283). 배치는
              #    ①계산 →②알림 →③장부 관문 →④커밋 순서였고, ③에서
              #    죽으면 ②는 이미 나간 뒤였다. 2026-08-17 밤 실제로 그랬다 —
              #    폰에는 "자산 999,078원", "챔피언 교체 SPY·QQQ"가 남았는데
              #    장부에는 그런 일이 없다. 관문에서 죽으면 대기열은 러너와
              #    함께 사라지고 실패 경보만 나간다.
              python -m quant notify --flush || true
              exit 0
            fi
            sleep $((2**i))
          done
          echo "❌ state/ 커밋 푸시 실패"; exit 1

      - name: Upload retrain output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-${{ github.run_id }}
          path: |
            retrain-all.txt
          if-no-files-found: ignore
      - name: 실패 경보 (디스코드/텔레그램)
        # 잡이 어느 단계에서 죽어도 폰으로 알린다 — 조용한 고장이 가장 위험하다.
        # 파이썬 의존성 없이 curl만 사용(의존성 설치 전에 죽어도 동작).
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MSG="🚨 [Quant] '${{ github.workflow }}' 실패 ($(date -u +%F)) — 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"$MSG\"}" "$DISCORD_WEBHOOK_URL" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "경보 전송 시도 완료 (설정된 채널 없으면 무시)"
