name: Nightly Retrain

# 야간 자동 재학습 — 매일 20:00 UTC(= 새벽 5시 KST, nightly-validate 1시간 뒤)에
# 실데이터로 챔피언/챌린저 2단계 검증을 돌리고, 결정 기록(state/)을 저장소에
# 커밋한다. 챔피언 교체는 '선발전+결승전'을 모두 통과한 후보가 있을 때만 일어난다.
#
# ⚠️ 대부분의 밤에는 "챔피언 유지"가 정상이다 — 재학습은 성공률을 계속 올리는
# 장치가 아니라, 시장 변화에 뒤처지지 않게 하고 검증된 개선만 반영하는 장치다.

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write   # state/ 결정 기록을 main에 커밋하기 위함

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml scikit-learn yfinance ccxt

      - name: 실데이터 확인 (합성 폴백이면 즉시 실패)
        # 가짜 데이터로 재학습·승격하면 안 된다 — retrain 자체도 폴백을 거부하지만
        # 여기서 먼저 확인해 실패 원인을 명확히 남긴다.
        run: |
          python - <<'PY'
          from quant.data import get_provider

          for market, symbol in (("crypto", "BTC/USDT"), ("us_stock", "SPY")):
              df = get_provider(market).get_ohlcv(symbol, "1d", limit=800)
              if df.attrs.get("synthetic_fallback"):
                  raise SystemExit(
                      f"❌ {market}/{symbol}: 실데이터 수신 실패 → 합성 폴백 감지. "
                      "재학습을 중단합니다.")
              print(f"✅ {market}/{symbol}: 실데이터 {len(df)}봉 수신")
          PY

      - name: Retrain crypto (BTC/USDT)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m quant retrain --market crypto --symbol BTC/USDT \
            --limit 800 | tee retrain-crypto.txt

      - name: Retrain us_stock (SPY)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m quant retrain --market us_stock --symbol SPY \
            --limit 800 | tee retrain-us-stock.txt

      - name: Retrain kr_stock (KODEX 200)
        # 국내주식은 데이터 소스(yfinance .KS)가 상대적으로 불안정하다 — 실패해도
        # 다른 시장의 재학습·기록 커밋을 막지 않는다.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m quant retrain --market kr_stock --symbol 069500.KS \
            --limit 800 | tee retrain-kr-stock.txt

      - name: 결과 요약 (Actions Summary)
        if: always()
        run: |
          {
            echo "## 🌙 야간 재학습 결과"
            echo '```'
            cat retrain-crypto.txt retrain-us-stock.txt retrain-kr-stock.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결정 기록 커밋 (state/)
        run: |
          if git diff --quiet -- state/ && [ -z "$(git status --porcelain state/)" ]; then
            echo "state/ 변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "야간 재학습 기록: $(date -u +%F) 챔피언 결정 [skip ci]"
          # 다른 커밋과 경합할 수 있으므로 리베이스 후 푸시(최대 4회 재시도)
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "❌ state/ 커밋 푸시 실패"; exit 1

      - name: Upload retrain output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-${{ github.run_id }}
          path: |
            retrain-crypto.txt
            retrain-us-stock.txt
            retrain-kr-stock.txt
          if-no-files-found: ignore
