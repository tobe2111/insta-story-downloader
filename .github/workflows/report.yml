name: Report

on:
  push:
    branches: ["claude/quick-report"]
  workflow_dispatch:

# 최소 권한 명시 — 미지정이면 저장소 기본값(조직 설정에 따라
# write-all일 수 있다)을 물려받는다. 워크플로가 필요한 만큼만 갖게 한다.
# 리포트 출력만 한다 — 쓰기 권한이 필요 없다.
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # 매달림 방어(2026-08-11 감사 77) — 무제한이면 배치가 멈춘 채
    # 몇 시간을 태우고 로그도 안 남는다. 값은 실측 최대의 3배 이상.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 버전 없이 설치하면 그날 PyPI 최신을 받는다 — 어느 날 메이저가
          # 올라오면 조용히 동작이 바뀐다(감사 130: pandas 3이 그렇게
          # 들어와 풀링 학습을 통째로 죽였고 몇 주 아무도 몰랐다).
          # requirements.txt 한 파일이 검사·실전을 함께 다스린다.
          pip install -r requirements.txt

      - name: Strategy performance report
        run: python scripts/quick_report.py
