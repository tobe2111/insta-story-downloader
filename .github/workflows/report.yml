name: Report

on:
  push:
    branches: ["claude/quick-report"]
  workflow_dispatch:

# 최소 권한 명시 — 미지정이면 저장소 기본값(조직 설정에 따라
# write-all일 수 있다)을 물려받는다. 워크플로가 필요한 만큼만 갖게 한다.
# 리포트 출력만 한다 — 쓰기 권한이 필요 없다.
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # 매달림 방어(2026-08-11 감사 77) — 무제한이면 배치가 멈춘 채
    # 몇 시간을 태우고 로그도 안 남는다. 값은 실측 최대의 3배 이상.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml scikit-learn ccxt

      - name: Strategy performance report
        run: python scripts/quick_report.py
