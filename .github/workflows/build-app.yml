name: Build App

# 무설치 실행파일(Windows/macOS/Linux)을 빌드해 GitHub Release에 첨부한다.
# → 저장소의 Releases 페이지가 곧 '다운로드 버튼이 있는 웹페이지'가 된다.
#   (로그인 없이 누구나 클릭 한 번으로 다운로드 가능)
#
# 실행 방법 (셋 중 하나):
#   1. [자동/권장] VERSION 파일을 바꿔 main에 머지 → 그 값으로 태그·릴리스가 자동 생성.
#      (예: VERSION 을 v0.2.3 으로 커밋하면 클릭 없이 v0.2.3 릴리스가 빌드됨)
#   2. Actions 탭 → "Build App" → Run workflow → 버전 입력 → 실행 (수동)
#   3. 또는 v* 태그 push
# 완료되면 https://github.com/<owner>/<repo>/releases/latest 에 OS별 파일이
# 다운로드 버튼과 함께 올라간다. 아래 '고정 주소'는 항상 최신을 가리킨다:
#   .../releases/latest/download/quant-cockpit-windows.exe   (Windows: 원본 실행파일)
#   .../releases/latest/download/quant-cockpit-macos.zip     (mac/Linux: zip)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 태그 (예: v0.2.0)"
        required: true
        default: "v0.2.0"
  push:
    tags: ["v*"]
    # VERSION 파일이 바뀐 채 main에 들어오면 자동 릴리스 (버전은 VERSION 내용으로 결정)
    branches: ["main"]
    paths: ["VERSION"]

permissions:
  contents: write   # Release 생성/자산 업로드에 필요

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: quant-cockpit-linux
          - os: windows-latest
            asset: quant-cockpit-windows
          - os: macos-latest
            asset: quant-cockpit-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 버전 결정: 수동 입력 > 태그 이름 > VERSION 파일 내용. 'v' 접두사는 자동 보정.
      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
          else
            v="$(tr -d ' \t\r\n' < VERSION)"
          fi
          case "$v" in v*) ;; *) v="v$v" ;; esac
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "resolved version: $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml scikit-learn yfinance ccxt pyinstaller

      - name: 배포판 표식 포함 (실거래 잠금)
        # 배포판 표식 — 실거래 명령을 소스 설치 전용으로 잠근다.
        # 판매·배포되는 실행파일에 실계좌 경로가 있으면 안 된다(규제 리스크):
        # 배포판은 백테스트·검증·페이퍼(모의)·조회 전용이다.
        shell: bash
        run: |
          printf 'DISTRIBUTION = True\n' > quant/_dist_build.py
          echo "🚫 배포판 표식 포함 — 실거래 명령은 소스 설치에서만 동작합니다"

      # E2E ①: 표식이 구워진 소스에서 실거래 경로 3곳이 정말 죽는지 실행으로 확인.
      # 빌드 로그의 echo 문자열만 믿는 검증은 회귀를 못 잡는다 — 명령을 진짜 돌린다.
      # ⚠️ 반드시 라이선스 자물쇠를 굽기 '전'에 돌려야 한다 — 자물쇠가 먼저
      # 구워지면 CLI가 잠금 문구 대신 라이선스 요구로 종료해 오판정된다.
      - name: 실거래 잠금 스모크 (소스+표식)
        shell: bash
        env:
          QUANT_WEBHOOK_SECRET: smoke-test-dummy
          # Windows 콘솔(cp1252)에서 한국어 잠금 문구가 \uXXXX로 이스케이프돼
          # 문구 매칭이 실패한다(v0.13.1에서 재현) — UTF-8 출력을 강제한다.
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          expect_block () {
            # 잠금이 SystemExit(비정상 종료) + 안내 문구를 내야 통과
            if out=$("$@" 2>&1); then
              echo "❌ 차단 실패(정상 종료): $*"; echo "$out"; exit 1
            fi
            case "$out" in *"실거래 기능이 없습니다"*) ;; *)
              echo "❌ 잠금 문구 없음: $*"; echo "$out"; exit 1 ;; esac
            echo "✅ 차단 확인: $*"
          }
          expect_block python -m quant live-daily --real
          expect_block python -m quant live --real --market crypto
          expect_block python -m quant webhook --live --market crypto

      - name: 라이선스 자물쇠 포함 (시크릿 설정 시 — 1인 1키 강제)
        # QUANT_LICENSE_SECRET(HMAC) 또는 QUANT_LICENSE_PUBKEY(Ed25519 공개키)가
        # GitHub Secrets에 있으면 배포본에 구워 넣는다 → 실행 시 정품 키를
        # 요구한다(어드민 대시보드의 키 발급과 같은 비밀을 써야 검증이 맞는다).
        # 미설정이면 지금처럼 누구나 실행 가능한 빌드가 나온다.
        shell: bash
        env:
          LIC_SECRET: ${{ secrets.QUANT_LICENSE_SECRET }}
          LIC_PUBKEY: ${{ secrets.QUANT_LICENSE_PUBKEY }}
        # ⚠️ printf로 따옴표 사이에 끼워 넣던 방식은 비밀에 " 나 개행이 하나만
        #    있어도 모듈을 깨뜨렸다. 그러면 자물쇠 없는 배포본이 나가면서
        #    로그는 "🔒 포함"이라고 거짓말한다 — 그래서 (a) 파이썬 리터럴로
        #    안전하게 쓰고 (b) 정말 물렸는지 즉시 확인해 실패시킨다.
        run: |
          python - <<'PY'
          import os, pathlib
          for env, mod, var in (("LIC_SECRET", "_license_key", "SECRET"),
                                ("LIC_PUBKEY", "_license_pub", "PUBLIC_KEY")):
              val = os.environ.get(env, "")
              if val:
                  pathlib.Path("quant", mod + ".py").write_text(
                      f"{var} = {val!r}\n", encoding="utf-8")
                  print(f"baked {mod}")
          PY
          if [ -n "$LIC_SECRET$LIC_PUBKEY" ]; then
            python - <<'PY'
          import sys
          from quant import licensing
          if not licensing._has_baked_credentials():
              sys.exit("❌ 자물쇠를 구웠는데 물리지 않았습니다(모듈 손상?) — 빌드 중단")
          print(f"🔒 자물쇠 확인 — lock_fingerprint: {licensing.lock_fingerprint()}")
          print("   ↑ 어드민 키 발급 화면의 지문과 같아야 발급한 키가 통과합니다")
          PY
          else
            echo "🔓 라이선스 시크릿 미설정 — 자물쇠 없이 빌드(누구나 실행 가능)"
          fi
          # 아래 왕복 스모크 단계의 조건(시크릿은 if:에서 직접 못 읽는다)
          if [ -n "$LIC_SECRET" ]; then
            echo "HAS_LIC_SECRET=1" >> "$GITHUB_ENV"
          fi

      - name: Build standalone executable
        run: >
          pyinstaller --onefile --noconfirm --name quant-cockpit
          --collect-submodules quant
          --console
          start.py

      # E2E ②: '실제로 빌드된 실행파일'이 표식을 품고 잠금이 사는지 확인.
      - name: 실거래 잠금 스모크 (빌드 산출물)
        shell: bash
        env:
          QUANT_SMOKE: "1"
        run: |
          set -e
          bin="dist/quant-cockpit"
          [ -f "$bin" ] || bin="dist/quant-cockpit.exe"
          out=$("$bin")
          echo "$out"
          case "$out" in *"dist_marker=1"*) ;; *)
            echo "❌ 빌드 산출물에 배포판 표식이 없습니다"; exit 1 ;; esac
          case "$out" in *"live_block=1"*) ;; *)
            echo "❌ 빌드 산출물에서 실거래 잠금이 동작하지 않습니다"; exit 1 ;; esac
          echo "✅ 빌드 산출물 잠금 확인"

      # E2E ③: 발급 ↔ 검증 왕복. '키를 발급하는 비밀'과 '배포본이 검증하는
      # 비밀'이 어긋나면 판 키가 전부 무효인데, 그걸 알려주는 장치가 없었다
      # (2026-08-11 감사). 여기서 같은 비밀로 키를 발급해 실행파일에 물려
      # 통과하는지, 가짜 키는 막히는지를 산출물로 직접 확인한다.
      - name: 라이선스 발급↔검증 왕복 스모크 (HMAC 시크릿 설정 시)
        if: ${{ env.HAS_LIC_SECRET == '1' }}
        shell: bash
        env:
          QUANT_SMOKE: "1"
          QUANT_LICENSE_SECRET: ${{ secrets.QUANT_LICENSE_SECRET }}
        run: |
          set -e
          bin="dist/quant-cockpit"; [ -f "$bin" ] || bin="dist/quant-cockpit.exe"
          owner="smoke@example.com"
          key=$(python -c "from quant.licensing import generate_key;print(generate_key('$owner'))")
          # 아래 실행에서는 비밀 환경변수를 반드시 뺀다 — 환경변수가 남아 있으면
          # 그쪽이 먼저 쓰여 '구워진 자물쇠'를 검증하지 못한다(무의미한 통과).
          run_bin() { env -u QUANT_LICENSE_SECRET -u QUANT_LICENSE_OWNER \
                          -u QUANT_LICENSE_KEY "$@" "$bin"; }
          # ① 자물쇠가 요구 상태인지 (키 없이 실행)
          out=$(run_bin)
          case "$out" in *"license_required=1"*) ;; *)
            echo "❌ 자물쇠를 구웠는데 배포본이 라이선스를 요구하지 않습니다"
            echo "$out"; exit 1 ;; esac
          # ② 발급한 진짜 키가 통과하는가 (발급↔검증 비밀 일치 증명)
          out=$(run_bin QUANT_LICENSE_OWNER="$owner" QUANT_LICENSE_KEY="$key")
          case "$out" in *"license_ok=1"*) ;; *)
            echo "❌ 발급한 키가 배포본에서 무효입니다 — 발급/검증 비밀 불일치"
            echo "$out"; exit 1 ;; esac
          # ③ 가짜 키는 막히는가
          out=$(run_bin QUANT_LICENSE_OWNER="$owner" \
                        QUANT_LICENSE_KEY="QUANT-AAAAAA-BBBBBB-CCCCCC-DDDDDD")
          case "$out" in *"license_ok=0"*) ;; *)
            echo "❌ 가짜 키가 통과했습니다 — 검증이 무력화됐습니다"
            echo "$out"; exit 1 ;; esac
          echo "✅ 발급↔검증 왕복 확인 (진짜 키 통과 · 가짜 키 차단)"

      # OS별 단일 zip으로 묶는다 — Release 자산 이름이 항상 같아야
      # 'releases/latest/download/<이름>.zip' 고정 주소가 성립한다.
      - name: Package (zip)
        shell: python
        run: |
          import os, zipfile
          out = "${{ matrix.asset }}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for name in os.listdir("dist"):
                  z.write(os.path.join("dist", name), name)
          print("packaged:", out)

      # 원본 실행파일도 그대로 첨부한다 — Windows는 받자마자 더블클릭(압축 해제 불필요).
      # mac/Linux는 브라우저로 원본 바이너리를 받으면 실행권한(+x)이 사라져 zip이 안전하므로
      # 원본 첨부는 Windows(.exe)만 한다.
      - name: Prepare raw binary
        shell: python
        run: |
          import os, shutil
          asset = "${{ matrix.asset }}"
          is_win = asset.endswith("windows")
          raw = ""
          if is_win:
              raw = asset + ".exe"
              shutil.copy(os.path.join("dist", "quant-cockpit.exe"), raw)
              print("raw binary:", raw)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("RAW_ASSET=%s\n" % raw)

      # 아티팩트도 유지(태그 없이 돌린 테스트 빌드 확인용)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

      # Release에 자산 첨부 — 다운로드 버튼이 있는 공개 페이지가 만들어진다.
      # 버전(APP_VERSION)은 위 'Resolve version'에서 결정된 값을 쓴다.
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Quant ${{ env.APP_VERSION }}"
          body: |
            무설치 실행파일 — 본인 OS용 파일을 받아 실행하세요.

            | OS | 파일 | 실행 |
            |---|---|---|
            | Windows | quant-cockpit-windows.exe | 받자마자 더블클릭 (압축 해제 불필요) |
            | macOS | quant-cockpit-macos.zip | 압축 해제 후 더블클릭 |
            | Linux | quant-cockpit-linux.zip | 압축 해제 후 실행 |

            ⚠️ 서명되지 않은 개인 빌드라 "알 수 없는 개발자"(Windows는 "PC 보호") 경고가 뜰 수 있습니다 → 실행 허용으로 진행.
            ⚠️ 이 프로그램은 수익을 보장하지 않습니다. 백테스트·페이퍼 검증 후 사용하세요.
          files: |
            ${{ matrix.asset }}.zip
            ${{ env.RAW_ASSET }}
