name: Research — trend core long history

# 추세추종 코어의 장기 검증(감사 335). 개발 컨테이너는 시세 서버에 닿지 못해
# 여기서 돌리고 결과를 로그로 읽는다. 장부·상태를 쓰지 않는다(읽기 전용).
on:
  push:
    paths:
      - "scripts/trend_core_research.py"
      - "scripts/trend_futures_research.py"
      - "quant/portfolio/trend_core.py"
      - ".github/workflows/research-trend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-extra.txt
      - name: Futures (crypto) trend research
        run: python scripts/trend_futures_research.py
      - name: Long-history trend research
        run: python scripts/trend_core_research.py
