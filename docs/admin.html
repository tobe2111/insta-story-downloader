<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Quant · 어드민</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%234c7dff%22/%3E%3Cpath d=%22M8 22 L14 14 L18 18 L24 9%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/pretendard.css">
<style>
:root{--bg:#0a0b0e;--bg2:#0e1013;--fg:#f4f5f7;--muted:#8f96a3;
  --line:rgba(255,255,255,.08);--accent:#4c7dff;--ok:#34d399;--bad:#f87171}
@media (prefers-color-scheme: light){
  :root{--bg:#fcfcfd;--bg2:#f4f5f8;--fg:#101318;--muted:#5a626e;
        --line:rgba(0,0,0,.09);--accent:#2f5fe0}}
*{box-sizing:border-box;margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Segoe UI",sans-serif;
     background:var(--bg);color:var(--fg);line-height:1.75;font-size:15px}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 60px}
nav{position:sticky;top:0;border-bottom:1px solid var(--line);background:var(--bg);z-index:5}
nav .wrap{display:flex;align-items:center;height:58px;gap:12px;padding-bottom:0}
.logo{font-weight:800;letter-spacing:.14em;color:var(--fg)}
.logo em{color:var(--accent);font-style:normal}
h1{font-size:24px;margin:30px 0 8px;letter-spacing:-.02em}
p{margin:8px 0;color:var(--muted)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;
      padding:20px 22px;margin:16px 0}
label{display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
label:last-child{border-bottom:0}
label .t{color:var(--fg);font-weight:600}
label .d{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
input[type=password],input[type=text],input[type=number]{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--fg);padding:8px 10px;font:inherit;font-size:14px;width:100%}
input[type=number]{width:90px;text-align:right}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
button{background:var(--accent);border:0;border-radius:9px;color:#fff;
  font:inherit;font-weight:700;padding:10px 18px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.msg{font-size:13.5px;margin-top:10px;min-height:20px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.warn{border-left:3px solid var(--bad);padding:12px 16px;background:var(--bg2);
  border-radius:0 12px 12px 0;font-size:13.5px;color:var(--muted);margin:18px 0}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);
  border-radius:99px;padding:1px 10px;color:var(--muted);margin-left:8px}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html">QUANT<em>.</em></a>
  <span class="pill">어드민</span>
  <a href="index.html" style="font-size:13.5px;color:var(--muted);margin-left:auto">← 홈</a>
</div></nav>
<div class="wrap">
<h1>운영 설정</h1>
<p>여기서 바꾼 값은 <b style="color:var(--fg)">config/settings.json</b> 커밋으로
저장되고, 다음 새벽 자동화부터 적용됩니다. 모든 변경은 git 역사에 남습니다 —
장부의 투명성 원칙은 어드민 개입에도 똑같이 적용됩니다.</p>

<div class="card" id="auth-card">
  <label style="display:block;cursor:default"><span class="t">GitHub 토큰
    <span class="d">repo 권한(Contents write)이 있는 Personal Access Token.
    이 브라우저에만 저장되며 우리 서버로 전송되지 않습니다(깃허브 API 직접 호출).</span></span>
  </label>
  <div style="display:flex;gap:8px;margin-top:8px">
    <input type="password" id="token" placeholder="github_pat_… 또는 ghp_…" autocomplete="off">
    <button id="connect">연결</button>
    <button class="ghost" id="forget" title="브라우저에서 토큰 삭제">삭제</button>
  </div>
  <div class="msg" id="auth-msg"></div>
</div>

<div class="card" id="settings-card" style="display:none">
  <label><span class="t">매매 일시정지
    <span class="d">신규 매매 중단 — 보유 포지션은 유지, 대기 주문은 폐기.
    재학습·기록·사이트 갱신은 계속 돕니다.</span></span>
    <input type="checkbox" id="trading_paused"></label>
  <label><span class="t">총노출 배수
    <span class="d">0.0~1.0 — 모든 목표 비중에 곱해집니다. 킬스위치와 중첩 적용
    (더 보수적인 쪽). 예: 0.5 = 노출 절반.</span></span>
    <input type="number" id="exposure_scale" min="0" max="1" step="0.1"></label>
  <label><span class="t">SNS 자동 게시
    <span class="d">끄면 스레드·인스타 게시를 건너뜁니다(콘텐츠 생성도 중단).</span></span>
    <input type="checkbox" id="social_post"></label>
  <label style="display:block;cursor:default"><span class="t">메모
    <span class="d">이 설정을 왜 바꿨는지 — 커밋 메시지에도 들어갑니다.</span></span>
    <input type="text" id="note" style="margin-top:6px" placeholder="예: 휴가 중 일시정지"></label>
  <div style="display:flex;gap:8px;margin-top:14px;align-items:center">
    <button id="save">저장 (커밋)</button>
    <button class="ghost" id="reload">다시 읽기</button>
    <span class="msg" id="save-msg" style="margin-top:0"></span>
  </div>
</div>

<div class="warn">⚠️ 이 페이지는 공개돼 있지만 <b>토큰 없이는 아무것도 바꿀 수
없습니다</b>. 저장 권한은 전적으로 GitHub 저장소 권한을 따릅니다. 토큰은
최소 권한(이 저장소의 Contents Read/Write만)으로 발급하세요.</div>

<script>
(function(){
var API="https://api.github.com/repos/tobe2111/insta-story-downloader/contents/config/settings.json";
var $=function(id){return document.getElementById(id)};
var sha=null;
function headers(){
  return {"Authorization":"Bearer "+(localStorage.getItem("gh_token")||""),
          "Accept":"application/vnd.github+json"};
}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,""))))}
function msg(id,text,ok){var el=$(id);el.textContent=text;
  el.className="msg "+(ok?"ok":"bad")}
function load(){
  fetch(API,{headers:headers()}).then(function(r){
    if(r.status===401||r.status===403)throw new Error("토큰이 유효하지 않거나 권한이 없습니다");
    if(r.status===404)throw new Error("settings.json이 아직 없습니다(첫 배포 전?)");
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){
    sha=d.sha;
    var s=JSON.parse(b64d(d.content));
    $("trading_paused").checked=!!s.trading_paused;
    $("exposure_scale").value=(s.exposure_scale!=null?s.exposure_scale:1.0);
    $("social_post").checked=(s.social_post!==false);
    $("note").value=s.note||"";
    $("settings-card").style.display="";
    msg("auth-msg","연결됨 — 현재 설정을 불러왔습니다.",true);
  }).catch(function(e){msg("auth-msg",e.message,false);
    $("settings-card").style.display="none"});
}
$("connect").onclick=function(){
  var t=$("token").value.trim();
  if(t)localStorage.setItem("gh_token",t);
  if(!localStorage.getItem("gh_token")){msg("auth-msg","토큰을 입력하세요",false);return}
  load();
};
$("forget").onclick=function(){localStorage.removeItem("gh_token");
  $("token").value="";$("settings-card").style.display="none";
  msg("auth-msg","토큰을 브라우저에서 지웠습니다.",true)};
$("reload").onclick=load;
$("save").onclick=function(){
  var scale=Math.min(1,Math.max(0,parseFloat($("exposure_scale").value)||1));
  var s={trading_paused:$("trading_paused").checked,
         exposure_scale:scale,
         social_post:$("social_post").checked,
         note:($("note").value||"").slice(0,500)};
  $("save").disabled=true;
  fetch(API,{method:"PUT",headers:headers(),body:JSON.stringify({
    message:"어드민 설정 변경"+(s.note?": "+s.note:"")+" [skip ci]",
    content:b64e(JSON.stringify(s,null,2)+"\n"),sha:sha})
  }).then(function(r){if(!r.ok)throw new Error("저장 실패 HTTP "+r.status);
    return r.json()}).then(function(d){sha=d.content.sha;
    msg("save-msg","저장됨 — 다음 새벽 자동화부터 적용됩니다.",true);
  }).catch(function(e){msg("save-msg",e.message,false)})
  .finally(function(){$("save").disabled=false});
};
if(localStorage.getItem("gh_token")){$("token").value="••••••••";load()}
})();
</script>
</body>
</html>
