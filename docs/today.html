<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant · 오늘의 판단 — 100만 챌린지</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%234c7dff%22/%3E%3Cpath d=%22M8 22 L14 14 L18 18 L24 9%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/pretendard.css">
<!-- 트레이딩뷰 심볼 매핑은 여기 인라인으로 갖고 있었다. 첫 화면에도 차트를
     넣으면서 파일 하나로 뺐다 — 같은 매핑을 두 곳에 적으면 상장 시장이
     바뀔 때 한쪽만 고쳐진다(FROZEN_IDEAS ①). -->
<script src="assets/tradingview.js"></script>
<style>
/* 촬영·공유용 한 장짜리 화면 — 다크 고정(방송 화질), 16:9에 맞는 밀도.
   ?card=1 이면 1200×630(공유 카드) 컴팩트 레이아웃으로 전환된다. */
:root{color-scheme:dark;--bg:#07080b;--bg2:#0e1013;--fg:#f4f5f7;--muted:#8f96a3;
  --dim:#5c6370;--line:#1e2128;--accent:#4c7dff;
  --ok:#f04452;--bad:#3182f6}     /* 증권사 관례: 상승 빨강 · 하락 파랑 */
*{box-sizing:border-box;margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,
  "Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);
  color:var(--fg);line-height:1.55;font-variant-numeric:tabular-nums;
  min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1080px;margin:0 auto;padding:34px 28px 20px;width:100%;flex:1}
.head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.logo{font-weight:800;font-size:17px;letter-spacing:.14em}
.logo em{font-style:normal;color:var(--accent)}
.date{color:var(--muted);font-size:14px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0 16px}
.hero{background:var(--bg2);border:1px solid var(--line);border-radius:16px;
  padding:20px 24px 16px;margin-bottom:14px}
.k{font-size:12.5px;color:var(--muted);font-weight:650}
.eq{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.pct{font-size:19px;font-weight:700}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.bar{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);
  overflow:hidden;margin:12px 0 4px}
.fill{height:100%;min-width:3px;background:var(--accent);
  border-radius:99px}
.lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}
td.rsn{text-align:left;font-size:12px;color:var(--muted);max-width:420px}
.news{background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:10px 16px;font-size:13.5px;color:var(--muted);margin-bottom:12px}
footer{font-size:12px;color:var(--dim);padding:10px 28px 18px;text-align:center}
footer b{color:var(--muted)}
/* 공유 카드 모드(1200×630) — 표를 줄이고 큰 숫자 중심 */
body.card .wrap{max-width:1200px;padding:26px 40px 0}
body.card h1{font-size:22px;margin-bottom:10px}
body.card .eq{font-size:64px}
body.card table{font-size:12.5px}
body.card td.rsn,body.card .rsncol{display:none}
body.card footer{padding-bottom:10px}
.err{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><span class="logo">QUANT<em>.</em></span>
  <span class="date" id="date">—</span></div>
<h1>오늘의 판단 — 100만 챌린지</h1>
<div id="content"><p class="err">불러오는 중…</p></div>
</div>
<footer id="foot">quant.jiwon-1a2.workers.dev · 가상 자금 모의투자 —
<b>실제 돈이 아니며 수익을 보장하지 않습니다</b> · 판단은 매일 새벽 1회(일봉 기준)</footer>
<script>
if(new URLSearchParams(location.search).get("card"))document.body.classList.add("card");
function esc(s){const d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function won(v){return Math.round(v).toLocaleString("ko-KR")+"원"}
function pct(v){return (v>=0?"+":"")+Number(v).toFixed(2)+"%"}
fetch("status.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(st=>{
  const el=document.getElementById("content");
  const keys=Object.keys(st.paper||{});
  if(!keys.length){el.innerHTML='<p class="err">아직 기록이 없습니다.</p>';return}
  if(st.updated)document.getElementById("date").textContent=st.updated+" 새벽 확정";
  const pfk=keys.filter(k=>k.startsWith("portfolio:"))[0];
  const rest=keys.filter(k=>!k.startsWith("portfolio"));
  let out="";
  // 통합 계좌 히어로
  if(pfk){
    const p=st.paper[pfk],hist=p.history||[],last=hist[hist.length-1]||{};
    const prev=hist[hist.length-2];
    const eq=last.equity!=null?last.equity:p.equity;
    // 장부의 day_pct 우선 — 입금이 수익으로 보이지 않게
    const day=(last&&last.day_pct!=null)?last.day_pct
      :(prev&&eq!=null?((eq/prev.equity-1)*100):null);
    const base=p.principal!=null?p.principal:(p.start_cash||1000000);
    const ret=base?((eq/base-1)*100):0;
    const cls=ret>=0?"pos":"neg";
    const ratio=p.goal?Math.min(1,eq/p.goal):0;
    /* ⚠️ 'N종목 분산'은 **후보 수**지 실제 보유가 아니다(2026-08-12 감사 117).
       감사 113(카드)·114(캡션)를 고치면서 이 페이지를 또 놓쳤다 —
       FROZEN_IDEAS ⑭ 여섯 번째 위반. 절반이 관망인 날도 있다. */
    const heldN=Object.values((last&&last.applied)||{}).filter(v=>v>0).length;
    const spread=heldN>0?`오늘 ${heldN}종목 보유 / 후보 ${rest.length}종목`
                        :`후보 ${rest.length}종목`;
    out+=`<div class="hero"><div class="k">통합 계좌 (${spread} · 시작 ${won(p.start_cash||1000000)})</div>
      <div><span class="eq ${cls}">${won(eq)}</span>
        <span class="pct ${cls}" style="margin-left:10px">${pct(ret)}</span>
        ${day!=null?`<span class="pct ${day>=0?"pos":"neg"}" style="margin-left:10px;font-size:15px">오늘 ${pct(day)}</span>`:""}</div>
      <div class="meta">원금(매칭 포함) ${won(base)} ·
        실력 지표(TWR) <b class="${(p.twr_pct||0)>=0?"pos":"neg"}">${pct(p.twr_pct||0)}</b> ·
        최대낙폭 ${typeof p.mdd_pct==="number"?p.mdd_pct+"%":"–"}</div>
      <div class="bar"><div class="fill" style="width:${Math.max(0.3,ratio*100)}%"></div></div>
      <div class="lbl"><span>100만 챌린지 · 100만원 → 1억</span>
        <span>${(ratio*100).toFixed(3)}%</span></div></div>`;
  }
  // 어젯밤 재학습 서사 — 오늘 교체가 있으면 크게
  const today=st.updated;
  const swaps=(st.swaps||[]).filter(s=>s.date===today);
  out+=`<div class="news">${swaps.length
    ?"🔁 어젯밤 재학습: 챔피언 교체 — "+swaps.map(s=>{
        const nm=((st.symbols||{})[s.key]||{}).name||s.key;
        return esc(nm)+" → "+esc(s.strategy)}).join(", ")
    :"어젯밤 재학습: 전 종목 챔피언 유지 (확실히 나은 후보 없음 — 정상)"}</div>`;
  // 종목별 오늘의 판단
  const rows=rest.map(k=>{
    const p=st.paper[k],hist=p.history||[],last=hist[hist.length-1]||{};
    const prev=hist[hist.length-2];
    const day=last.day_pct!=null?last.day_pct
      :(prev&&last.equity!=null?((last.equity/prev.equity-1)*100):null);
    const nm=((st.symbols||{})[k]||{}).name||k.split(":")[1]||k;
    const w=last.weight;
    const stance=w==null?"–":(Math.abs(w)<0.005?"관망 (현금)":(w>0?"매수 ":"매도 ")+Math.round(Math.abs(w)*100)+"%");
    const sgn=v=>v>0.004?"pos":v<-0.004?"neg":"";
    const zpct=v=>Math.abs(v)<0.005?"0.00%":pct(v);
    return `<tr><td><b>${esc(nm)}</b></td>
      <td>${stance}</td>
      <td class="${day==null?"":sgn(day)}">${day==null?"–":zpct(day)}</td>
      <td class="rsn">${esc(String(last.reason||""))}</td></tr>`;
  }).join("");
  out+=`<table><tr><th>종목</th><th>오늘의 자세</th><th>일간</th>
    <th class="rsncol" style="text-align:left">판단 근거 (새벽 기준)</th></tr>${rows}</table>
    <p style="font-size:12px;color:var(--muted);margin-top:8px">※ '일간'은 그 종목
    계좌 자산의 어제 대비 변화입니다. '오늘의 자세'는 새벽의 결정이라, 관망이어도
    어제 보유분의 손익·체결 시차(주식은 다음 시가 체결)·수수료가 일간에 남을 수
    있습니다. 어제도 완전 현금이었던 종목만 정확히 0.00%입니다.</p>`;

  // 오늘의 체결·예약 — "언제, 얼마에 사고팔았나 / 내일 뭘 살 예정인가"
  {
    const pf=st.paper["portfolio:ALL"]||{};
    const rec=(pf.history||[])[(pf.history||[]).length-1]||{};
    const nm=k=>((st.symbols||{})[k]||{}).name||String(k).split(":")[1]||k;
    const fills=rec.fills||[];
    const pend=rec.pending_next_open||{};
    let ftab="";
    if(fills.length){
      ftab=`<table><tr><th style="text-align:left">종목</th><th>체결 방식</th>
        <th>체결가</th><th>체결 시점</th></tr>`+fills.map(f=>{
        const t=f.type||"시가";
        const when=t==="즉시"?"새벽 결정 직후":(String(f.bar||"").slice(0,10)+" 개장 시가");
        return `<tr><td style="text-align:left"><b>${esc(nm(f.key))}</b>${
          f.side?` <span style="color:var(--muted);font-size:12px">${f.side==="buy"?"매수":"매도"}</span>`:""}</td>
          <td>${t==="즉시"?"즉시(코인)":"다음 시가(주식)"}</td>
          <td>${Number(f.price).toLocaleString()}</td><td>${when}</td></tr>`}).join("")+`</table>`;
    }else ftab=`<p style="color:var(--muted);font-size:13px">오늘 체결된 주문이 없습니다.</p>`;
    let ptab="";
    const pkeys=Object.keys(pend).filter(k=>Math.abs(pend[k])>0.0005);
    if(pkeys.length){
      ptab=`<table><tr><th style="text-align:left">종목</th><th title="통합 계좌(시작 100만원) 기준 목표 비중">통합 계좌 목표 비중</th>
        <th>체결 예정</th></tr>`+pkeys.sort((a,b)=>pend[b]-pend[a]).map(k=>
        `<tr><td style="text-align:left"><b>${esc(nm(k))}</b></td>
         <td>${(pend[k]*100).toFixed(2)}%</td>
         <td>다음 장 시가</td></tr>`).join("")+`</table>`;
    }else ptab=`<p style="color:var(--muted);font-size:13px">예약된 주문이 없습니다(전 종목 관망 또는 이미 체결).</p>`;

    /* 손대지 않은 이유 — 장부에는 남는데 화면에 없던 값들(감사 105).
       "왜 오늘 이 종목은 안 고쳤나"는 체결·예약만큼 중요한 질문이다.
       비용이 이득보다 크면 **안 하는 것**이 판단이고, 그 판단도 공개한다. */
    let skipTab="";
    {
      const dust=rec.skipped_dust||[], cool=rec.skipped_cooldown||[];
      const rb=rec.rebalance_band||null;
      const rows=[];
      if(dust.length)rows.push(`<tr><td style="text-align:left"><b>잔돈 주문 차단</b></td>
        <td>${dust.length}종목</td><td style="text-align:left;color:var(--muted)">${
        esc(dust.map(nm).join(" · "))}</td></tr>`);
      if(cool.length)rows.push(`<tr><td style="text-align:left"><b>재조정 쿨다운</b></td>
        <td>${cool.length}종목</td><td style="text-align:left;color:var(--muted)">${
        esc(cool.map(nm).join(" · "))}</td></tr>`);
      if(rb)for(const [m,b] of Object.entries(rb)){
        const nmk={crypto:"코인",kr_stock:"한국주식",us_stock:"미국주식"}[m]||m;
        rows.push(`<tr><td style="text-align:left"><b>${esc(nmk)} 재조정 밴드</b></td>
          <td>${(b.band*100).toFixed(0)}%</td>
          <td style="text-align:left;color:var(--muted)">왕복비용 ${b.roundtrip_bp}bp(${
          esc(b.source)}${b.n?` · 표본 ${b.n}건`:""}) 기준 — 이보다 덜 벗어나면 그대로 둡니다</td></tr>`);
      }
      if(rows.length)skipTab=`<h2 style="font-size:16px;margin:20px 0 6px">오늘 손대지 않은 이유
        <span style="font-size:12px;color:var(--muted);font-weight:400">비용이 이득보다 크면 안 하는 것도 판단입니다</span></h2>
        <table><tr><th style="text-align:left">사유</th><th>대상</th>
        <th style="text-align:left">설명</th></tr>${rows.join("")}</table>`;
    }
    out+=`<h2 style="font-size:16px;margin:26px 0 6px">오늘의 체결 <span style="font-size:12px;color:var(--muted);font-weight:400">진입 시점·가격 — 장부 그대로</span></h2>${ftab}
      <h2 style="font-size:16px;margin:20px 0 6px">예약 주문 <span style="font-size:12px;color:var(--muted);font-weight:400">오늘 새벽 결정 → 다음 장 시가 체결</span></h2>${ptab}
      ${skipTab}
      <p style="font-size:12px;color:var(--muted);margin-top:8px">※ 주식은 "결정한 날 종가에 산 척"하지 않고
      실제로 가능한 체결(다음 세션 개장 시가, 갭 감수)만 인정합니다 — 백테스트 눈속임 방지 규칙.</p>`;
  }

  // 실시간 차트(TradingView) — 표시 전용. 매매 판단은 새벽 데이터만 쓴다.
  if(!location.search.includes("card=1")){
    const tvMap=QuantTV.symbol;         // 매핑은 assets/tradingview.js 한 곳에
    const opts=rest.map(k=>{const tv=tvMap(k);
      return tv?`<option value="${tv}">${esc(((st.symbols||{})[k]||{}).name||k)}</option>`:""}).join("");
    out+=`<h2 style="font-size:16px;margin:26px 0 6px">실시간 차트
      <span style="font-size:12px;color:var(--muted);font-weight:400">TradingView · 표시 전용(판단은 새벽 데이터)</span>
      <select id="tvsel" style="float:right;background:var(--bg2,#12141a);color:inherit;
        border:1px solid rgba(128,128,128,.3);border-radius:8px;padding:4px 8px;font-size:13px">${opts}</select></h2>
      <div id="tvchart" style="height:440px;border:1px solid rgba(128,128,128,.2);border-radius:12px;overflow:hidden"></div>`;
  }
  el.innerHTML=out;
  // TradingView 위젯 로드 — 셀렉터로 종목 전환(위젯 재생성)
  const tvBox=document.getElementById("tvchart");
  if(tvBox){
    const load=sym=>QuantTV.mount(tvBox,sym);
    const sel=document.getElementById("tvsel");
    load(sel.value);
    sel.onchange=()=>load(sel.value);
  }
}).catch(()=>{document.getElementById("content").innerHTML=
  '<p class="err">기록을 불러오지 못했습니다.</p>'});
</script>
</body>
</html>
