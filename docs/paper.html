<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant · 매일 자동 페이퍼 현황</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%234c7dff%22/%3E%3Cpath d=%22M8 22 L14 14 L18 18 L24 9%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0b0e; --bg2:#0e1013; --fg:#f4f5f7; --muted:#8f96a3; --dim:#5c6370;
  --line:rgba(255,255,255,.08); --accent:#4c7dff; --ok:#34d399; --bad:#f87171;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#fcfcfd; --bg2:#f4f5f8; --fg:#101318; --muted:#5a626e;
         --dim:#8a919d; --line:rgba(0,0,0,.09); --accent:#2f5fe0; }
}
*{box-sizing:border-box;margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Segoe UI",sans-serif;
     background:var(--bg);color:var(--fg);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;border-bottom:1px solid var(--line);background:var(--bg)}
nav .wrap{display:flex;align-items:center;height:58px;gap:12px}
.logo{font-weight:800;letter-spacing:.14em;color:var(--fg)}
.logo em{color:var(--accent);font-style:normal}
h1{font-size:26px;margin:34px 0 6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;
      padding:18px 20px;margin:14px 0}
.card h2{font-size:16px;margin-bottom:8px}
.big{font-size:30px;font-weight:800}
.pos{color:var(--ok)} .neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.spark{width:100%;height:56px;margin-top:10px}
.note{color:var(--muted);font-size:12.5px;margin:26px 0 40px}
.err{color:var(--bad);padding:30px 0}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html">QUANT<em>.</em></a>
  <a href="index.html" style="font-size:13.5px;color:var(--muted)">← 홈</a>
</div></nav>
<div class="wrap">
<h1>매일 자동 페이퍼 현황</h1>
<p class="sub">클라우드가 매일 새벽 챔피언 전략으로 모의 매매를 하고 이 페이지를
갱신합니다 — 여러분은 아무것도 하지 않아도 됩니다. <b>가짜 돈</b>이며, 좋은
결과도 미래 수익을 보장하지 않습니다.</p>
<div id="content"><p class="sub">불러오는 중…</p></div>
<p class="note">🌙 챔피언은 매일 밤 챔피언/챌린저 2단계 검증으로 재평가되며,
확실히 나은 후보가 있을 때만 교체됩니다(안 바뀌는 날이 정상).
기록 원본: 저장소 <code>state/</code> 폴더.</p>
</div>
<script>
function esc(s){const d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function spark(hist){
  if(hist.length<2) return "";
  const w=800,h=56,eq=hist.map(r=>r.equity);
  const mn=Math.min(...eq),mx=Math.max(...eq),span=(mx-mn)||1;
  const pts=eq.map((v,i)=>`${(i/(eq.length-1)*w).toFixed(1)},${(h-4-(v-mn)/span*(h-8)).toFixed(1)}`);
  const up=eq[eq.length-1]>=eq[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts.join(" ")}" fill="none"
      stroke="${up?"var(--ok)":"var(--bad)"}" stroke-width="2"/></svg>`;
}
fetch("status.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(st=>{
  const el=document.getElementById("content");
  const keys=Object.keys(st.paper||{});
  if(!keys.length){el.innerHTML='<p class="sub">아직 기록이 없습니다 — 첫 자동 실행(새벽 5:30) 이후에 나타납니다.</p>';return}
  el.innerHTML=keys.map(k=>{
    const p=st.paper[k],hist=p.history||[];
    const ret=p.return_pct??0,cls=ret>=0?"pos":"neg";
    const champ=(st.champions&&st.champions[k])?esc(JSON.stringify(st.champions[k].params)):"기본(ml·logreg)";
    const rows=hist.slice(-14).reverse().map(r=>{
      const hr=(typeof r.hit_rate==="number")?(r.hit_rate*100).toFixed(1)+"%":"–";
      return `<tr><td>${esc(r.date)}</td><td>${r.price.toLocaleString()}</td>
        <td>${(r.weight*100).toFixed(0)}%</td><td>${r.equity.toLocaleString()}</td>
        <td class="${r.return_pct>=0?"pos":"neg"}">${r.return_pct>=0?"+":""}${r.return_pct}%</td>
        <td>${hr}</td></tr>`}).join("");
    const mdd=(typeof p.mdd_pct==="number")?p.mdd_pct:null;
    return `<div class="card"><h2>${esc(k)}</h2>
      <div class="big ${cls}">${ret>=0?"+":""}${ret}%</div>
      <div class="sub">시작 ${p.start_cash.toLocaleString()} → 현재 ${Number(p.equity).toLocaleString()} (가짜 돈)${
        mdd==null?"":` · 최대낙폭 <b class="neg">${mdd}%</b>`}</div>
      ${spark(hist)}
      <div class="sub" style="margin-top:8px">🏆 현재 챔피언: <code>${champ}</code></div>
      <table><tr><th>날짜</th><th>가격</th><th>비중</th><th>자산</th><th>누적수익</th><th>적중률(60일)</th></tr>${rows}</table>
    </div>`}).join("");
  if(st.updated){document.querySelector(".sub").innerHTML+=` <b>마지막 갱신: ${esc(st.updated)}</b>`}
}).catch(()=>{document.getElementById("content").innerHTML=
  '<p class="err">아직 기록이 없습니다 — 첫 자동 실행 이후에 나타납니다.</p>'});
</script>
</body>
</html>
