# 퀀트 시스템 설정 예제.
# 실제 사용 시 config.yaml 로 복사하고 값을 채우세요. (config.yaml 은 .gitignore 됨)
# ⚠️ API 키는 이 파일이 아니라 환경변수로 주입하는 것을 강력히 권장합니다.

market: crypto            # crypto | us_stock | kr_stock | synthetic
symbol: BTC/USDT
timeframe: 1d

strategy:
  name: ma_cross         # ma_cross | momentum | mean_reversion
  params:
    fast: 20
    slow: 60

risk:
  sizing: vol_target     # fixed | vol_target
  target_vol: 0.20       # 목표 연율 변동성 20%
  max_position: 1.0      # 종목당 최대 노출 100%
  stop_loss: 0.15        # -15% 손절
  take_profit: null      # 익절 미사용
  trailing_stop: 0.10    # 고점 대비 -10% 되돌리면 청산(이익 보호). null=미사용

backtest:
  initial_capital: 10000
  fee: 0.001             # 편도 수수료 0.1%
  slippage: 0.0005

# 실거래 키는 아래처럼 환경변수로만 주입하세요 (파일에 저장 금지):
#   export EXCHANGE_API_KEY="..."
#   export EXCHANGE_SECRET="..."
